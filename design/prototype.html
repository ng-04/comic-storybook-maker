    const toDraw = chars.filter((c) => (c.sheet.status === 'none' || c.sheet.status === 'failed') && (c.name.trim() || c.appearance.trim()));
    const imgCount = chars.reduce((n, c) => n + (c.refs || []).length, 0) + (st.setup.refs || []).length;
    const noImgs = !this.state.stories.some((x) => (x.setup.refs || []).length || x.characters.some((c) => (c.refs || []).length));
    const stripeFor = { nayak: ['#1F4FB8', '#FFFFFF'], pratinayak: ['#FF4A3D', '#141414'], guru: ['#8A4FD1', '#FFFFFF'] };
    const card = (c) => {
      const sh = c.sheet;
      const hasArt = sh.versions.length > 0 && sh.status !== 'drawing';
      const stripe = stripeFor[c.role] || ['#FFD93B', '#141414'];
      const human = c.form === 'Human' || c.form === 'Divine being';
      const dn = c.name || 'this character';
      const up = (patch) => this.updateChar(st.id, c.id, patch);
      const note = sh.versions[sh.active] && sh.versions[sh.active].note;
      const sheetFig = (x, flip) => {
        const f = { t: `translate(${x} 250) scale(${flip ? -1.3 : 1.3} 1.3)`, op: 1, pet: !human, cape: c.form === 'Divine being', bun: human && c.gender === 'female', color: c.color };
        return figSvg(f, { ink: '#141414', sw: 4, dash: 'none', fo: 1 }, true);
      };
      return `<article class="panel" style="padding:0;overflow:hidden">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:4px solid #141414;background:${stripe[0]}">
          <div style="display:flex;gap:12px;align-items:center;min-width:0">${charIcon(c, 52)}<div style="min-width:0"><h2 class="h2" style="color:${stripe[1]};overflow-wrap:anywhere">${esc(c.name || 'New ' + ROLE_LABELS[c.role].toLowerCase())}</h2><p style="margin:0;font-size:14px;font-weight:700;color:${stripe[1]}">${ROLE_LABELS[c.role]} · ${c.gender === 'female' ? 'Female' : 'Male'} · ${esc(c.form)}${c.isKey ? ' · key' : ''}</p></div></div>
          ${when(!(c.role === 'nayak' && nayaks === 1), () => `<button class="btn btn-sm" data-click="${this.H(() => this.removeChar(c))}">Remove</button>`)}
        </div>
        <div style="padding:18px;display:flex;flex-direction:column;gap:18px">
          <div style="display:flex;flex-wrap:wrap;gap:20px">
            <div style="flex:999 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px">
              <fieldset><legend class="label">Male or female</legend><div style="display:flex;gap:10px">
                <button class="gtog" ${pressed(c.gender !== 'female')} data-click="${this.H(() => up({ gender: 'male' }))}">${maleIcon(44)}Male</button>
                <button class="gtog" ${pressed(c.gender === 'female')} data-click="${this.H(() => up({ gender: 'female' }))}">${femaleIcon(44)}Female</button>
              </div></fieldset>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:14px">
                <div><label class="label" for="n-${c.id}">Name</label><input class="input" id="n-${c.id}" value="${esc(c.name)}" placeholder="e.g. Chiku" data-input="${this.H((e) => up({ name: e.target.value }))}"></div>
                <div><label class="label" for="fm-${c.id}">Form</label><select class="input" id="fm-${c.id}" data-change="${this.H((e) => up({ form: e.target.value }))}">${each(FORMS, (f) => `<option value="${f}" ${c.form === f ? 'selected' : ''}>${f}</option>`)}</select></div>
                <div><label class="label" for="r-${c.id}">Role</label><select class="input" id="r-${c.id}" data-change="${this.H((e) => { const r = e.target.value; up({ role: r, isKey: r === 'nayak' || r === 'pratinayak' ? true : c.isKey }); })}">${each(ROLE_OPTIONS, (o) => `<option value="${o[0]}" ${c.role === o[0] ? 'selected' : ''}>${o[1]}</option>`)}</select></div>
                <div><label class="label" for="a-${c.id}">Age</label><input class="input" id="a-${c.id}" inputmode="numeric" value="${esc(c.age)}" placeholder="Optional" data-input="${this.H((e) => up({ age: e.target.value.replace(/[^0-9]/g, '').slice(0, 3) }))}"></div>
              </div>
              <div><label class="label" for="d-${c.id}">What do they look like?</label><textarea class="input" id="d-${c.id}" rows="2" placeholder="e.g. A small grey monkey with a red thread tied on one wrist" data-input="${this.H((e) => up({ appearance: e.target.value }))}">${esc(c.appearance)}</textarea></div>
              <label style="display:flex;gap:10px;align-items:center;font-weight:700;min-height:44px;cursor:pointer"><input type="checkbox" id="k-${c.id}" style="width:22px;height:22px;accent-color:#1F4FB8" ${c.isKey ? 'checked' : ''} ${dis(c.role === 'nayak')} data-change="${this.H((e) => up({ isKey: !!e.target.checked }))}">Key character (shapes the plot)</label>
            </div>
            <div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:10px">
              <span class="label" style="margin:0">Character sheet</span>
              <div style="aspect-ratio:4/3;border:4px solid #141414;border-radius:6px;background:#FFFDF8;overflow:hidden;position:relative">
                ${when(hasArt, () => `<svg viewBox="0 0 400 300" style="display:block;width:100%;height:100%" role="img" aria-label="Cartoon character sheet for ${esc(dn)}"><rect width="400" height="300" fill="#FFFDF8"/><path d="M0 250 H400" stroke="#141414" stroke-width="3" stroke-dasharray="6 8"/>${sheetFig(100, false)}${sheetFig(290, true)}</svg>`)}
                ${when(sh.status === 'none' || (sh.status === 'failed' && !sh.versions.length), '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font-weight:700;color:#4A4A4A">No sheet yet. Describe them, then draw one.</div>')}
                ${when(sh.status === 'drawing', '<div role="status" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#FFD93B 0 14px,#FFF3B8 14px 28px)"><span style="background:#fff;border:3px solid #141414;padding:6px 12px;display:flex;gap:8px;align-items:center;font-weight:700"><span class="spin" aria-hidden="true"></span>Drawing sheet…</span></div>')}
                ${when(sh.status === 'approved', `<span class="badge b-done" style="position:absolute;top:8px;left:8px">${ICON.check}Approved</span>`)}
              </div>
              ${when(hasArt && note, () => `<div class="note" style="font-size:15px"><span>${esc(note)}</span></div>`)}
              ${when(sh.error && sh.status !== 'drawing', () => `<div class="note note-err" role="alert" style="font-size:15px"><span><strong>We couldn't draw this sheet.</strong> ${esc(sh.error)}</span></div>`)}
              <div class="row" style="gap:8px">
                ${when(sh.status === 'none' || sh.status === 'failed', () => `<button class="btn btn-sm btn-blue" data-click="${this.H(() => this.drawSheet(c))}">${sh.status === 'failed' ? 'Try again' : 'Draw character sheet'}</button>`)}
                ${when(sh.status === 'review', () => `<button class="btn btn-sm btn-primary" data-click="${this.H(() => this.approveSheet(c))}">Approve</button><button class="btn btn-sm" data-click="${this.H(() => this.drawSheet(c))}">Regenerate</button>`)}
                ${when(sh.status === 'approved', () => `<button class="btn btn-sm" data-click="${this.H(() => this.drawSheet(c))}">Regenerate</button>`)}
              </div>
            </div>
          </div>
          ${when(c.isKey, () => `<fieldset style="border:3px dashed #141414;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px"><legend class="label" style="padding:0 6px;margin:0">What drives ${esc(dn)}? <span class="muted" style="font-weight:400">Choose one or more purusharthas</span></legend>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px">${each(PA, (p) => {
              const v = (c.purushartha && c.purushartha[p.k]) || { on: false, note: '' };
              const bg = v.on ? p.bg : '#fff', ink = v.on ? p.ink : '#141414';
              return `<div class="stack" style="gap:8px"><button class="pa" ${pressed(v.on)} style="background:${bg};color:${ink};box-shadow:${v.on ? '3px 3px 0 #141414' : 'none'}" data-click="${this.H(() => this.togglePa(c, p.k))}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto;margin-top:2px"><path d="${p.icon}"/></svg><span><span style="display:block;font-family:'Bangers',Impact,sans-serif;font-size:20px;letter-spacing:.04em">${p.k}</span><span style="font-size:14px;font-weight:700">${p.hint}</span></span></button>
                ${when(v.on, () => `<div><label class="label" style="font-size:15px" for="pa-${p.k}-${c.id}">${esc(p.q.replace('{n}', dn))}</label><input class="input" style="font-size:15px;min-height:44px" id="pa-${p.k}-${c.id}" value="${esc(v.note)}" placeholder="${esc(p.ph)}" data-input="${this.H((e) => this.paNote(c, p.k, e.target.value))}"></div>`)}</div>`;
            })}</div></fieldset>`)}
          <div class="stack" style="gap:8px"><span class="label" style="margin:0">Reference images <span class="muted" style="font-weight:400">(optional, add several)</span></span>${this.vRefs(c.refs, { type: 'char', id: c.id }, 'f-' + c.id)}</div>
        </div></article>`;
    };
    return `<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
      <div style="flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:24px">
        ${this.stepHead(3, 'Paatra', "Who's in the story?", "Every katha needs a nayak. For key characters, choose what drives them: the four purusharthas. Approve each cartoon sheet; it's the reference for every page.")}
        ${when(heroMissing, '<div class="note note-warn" role="status"><strong>Give your nayak a name to continue.</strong></div>')}
        ${each(chars, card)}
        <div class="panel row" style="padding:16px;box-shadow:none;border-style:dashed"><span style="font-weight:700;margin-right:6px">Add a paatra:</span>${each([['sahayak', 'Sahayak'], ['mitra', 'Mitra'], ['guru', 'Guru'], ['parivaar', 'Parivaar'], ['pratinayak', 'Pratinayak']], (r) => `<button class="chip" data-click="${this.H(() => this.addChar(r[0]))}">${ICON.plus}${r[1]}</button>`)}</div>
        <div class="row" style="justify-content:space-between;gap:12px"><button class="btn" data-click="${this.H(() => this.go('kaal'))}">Back</button>
          <div class="row"><span class="muted" style="font-size:15px">${chars.length - pending.length} of ${chars.length} sheets approved</span><button class="btn" ${dis(!toDraw.length)} data-click="${this.H(() => toDraw.forEach((c) => this.drawSheet(c)))}">Draw all sheets</button><button class="btn btn-primary" ${dis(heroMissing)} data-click="${this.H(() => this.go('paristhiti'))}">Next: Paristhiti</button></div></div>
      </div>
      <aside style="flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:16px">
        <div class="panel" style="padding:18px;display:flex;flex-direction:column;gap:10px"><h2 class="h2">The four purusharthas</h2>
          ${each(PA, (p) => `<div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:0 0 auto;width:36px;height:36px;border:3px solid #141414;border-radius:8px;background:${p.bg};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${p.ink}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${p.icon}"/></svg></span><span><strong>${p.k}</strong> · ${p.hint}</span></div>`)}
          <p class="hint" style="margin:0">Kaam is always written in a child-friendly way: wishes, ambition and love for family and friends.</p></div>
        <div class="panel" style="padding:18px;display:flex;flex-direction:column;gap:10px;background:#E6EEFF"><h2 class="h2">About your images</h2>
          <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li>Images only guide the cartoon sheets and pictures. They never appear in shared links or printed books.</li><li>Photos of children are sometimes declined by the image service. If so, we draw from your description and tell you.</li><li>[YOUR RETENTION POLICY]</li></ul>
          <p style="margin:0;font-weight:700">Uploaded in this katha: ${imgCount === 1 ? '1 image' : imgCount + ' images'}</p>
          <button class="btn btn-sm" style="align-self:flex-start" ${dis(noImgs)} data-click="${this.H(() => this.askDeletePhotos())}">Delete my images</button></div>
      </aside></div>`;
  }

  vParisthiti(st) {
    const setup = st.setup, H = this.cast(st.characters).H;
    const setK = (k) => (e) => { const v = e.target.value; this.updateSetup((x) => Object.assign({}, x, { [k]: v })); };
    const prompts = ['What changed just before the story?', 'Who is in trouble?', 'What rule or promise is being tested?', 'Why can’t ' + H + ' simply walk away?'];
    return `<div style="max-width:860px;display:flex;flex-direction:column;gap:26px">
      ${this.stepHead(4, 'Paristhiti', 'What led to this moment?', "The circumstances before the story begins: what happened, what changed, and what's now at stake for " + esc(H) + '.')}
      <div><label class="label" for="paristhiti">The situation</label><textarea class="input" id="paristhiti" rows="6" placeholder="e.g. The monsoon came early. The river flooded the crocodile's home, and the only safe place left is the monkey's island, which the other monkeys refuse to share." data-input="${this.H(setK('paristhiti'))}">${esc(setup.paristhiti)}</textarea>
        <div class="row" style="gap:8px;margin-top:10px"><span class="hint" style="margin:0">Think about:</span>${each(prompts, (t) => `<button class="chip chip-sm chip-light" data-click="${this.H(() => { this.updateSetup((x) => Object.assign({}, x, { paristhiti: (x.paristhiti ? x.paristhiti.trim() + '\n' : '') + t + ' ' })); this.later(() => { const el = document.getElementById('paristhiti'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 30); })}">${esc(t)}</button>`)}</div></div>
      <div><label class="label" for="stakes">What's at stake? <span class="muted" style="font-weight:400">(one line, optional)</span></label><input class="input" id="stakes" value="${esc(setup.stakes)}" placeholder="e.g. A friendship, and a promise made long ago" data-input="${this.H(setK('stakes'))}"></div>
      ${this.navRow('paatra', 'Back', 'katha', 'Next: Katha')}
    </div>`;
  }

  vKatha(st) {
    const s = this.state, setup = st.setup, chars = st.characters;
    const setKey = (k, v) => this.updateSetup((x) => Object.assign({}, x, { [k]: v }));
    const chipRow = (arr, cur, k, sm, fmt) => `<div class="row" style="gap:8px">${each(arr, (v) => `<button class="chip ${sm ? 'chip-sm' : ''}" ${pressed(cur(v))} data-click="${this.H(() => setKey(k, v))}">${esc(fmt ? fmt(v) : v)}</button>`)}</div>`;
    const fmt = this.chooseFormat(setup, chars);
    const miss = this.missing(st);
    const subs = (setup.desh.subs || []).filter(Boolean);
    const named = chars.filter((c) => c.name);
    const keyNames = chars.filter((c) => c.isKey && c.name).map((c) => { const d = Object.keys(c.purushartha || {}).filter((k) => c.purushartha[k].on); return c.name + (d.length ? ' (' + d.join(', ') + ')' : ''); });
    const glance = [
      ['Desh', (this.clean(setup.desh.main) || '[no place yet]') + (subs.length ? ' (' + subs.join(', ') + ')' : ''), 'desh'],
      ['Kaal', this.kaalPhrase(setup.kaal).replace(/^./, (m) => m.toUpperCase()), 'kaal'],
      ['Paatra', keyNames.length ? keyNames.join(' · ') + (named.length > keyNames.length ? ' + ' + (named.length - keyNames.length) + ' more' : '') : 'Add your paatra', 'paatra'],
      ['Paristhiti', this.clean(setup.paristhiti) ? (setup.paristhiti.length > 110 ? setup.paristhiti.slice(0, 107) + '…' : setup.paristhiti) : '[not set: optional, but it makes the story richer]', 'paristhiti']
    ];
    const formatCard = (f) => {
      const on = setup.format === f[0];
      const pic = f[0] === 'single' ? '<rect x="6" y="6" width="28" height="30" fill="#7FB2FF" stroke="#141414" stroke-width="2"/><rect x="6" y="40" width="28" height="8" fill="#FFD93B" stroke="#141414" stroke-width="2"/>'
        : f[0] === 'grid' ? [[6, 6], [21, 6], [6, 20], [21, 20], [6, 34], [21, 34]].map((xy, i) => `<rect x="${xy[0]}" y="${xy[1]}" width="13" height="12" fill="${i % 3 ? '#8FD3A8' : '#7FB2FF'}" stroke="#141414" stroke-width="1.8"/>`).join('')
        : '<path d="M20 12l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#FFD93B" stroke="#141414" stroke-width="2" stroke-linejoin="round"/><rect x="8" y="38" width="24" height="8" fill="#FF4A3D" stroke="#141414" stroke-width="2"/>';
      return `<button class="pa" ${pressed(on)} style="background:${on ? '#FFD93B' : '#fff'};box-shadow:${on ? '3px 3px 0 #141414' : 'none'};flex-direction:column;gap:8px" data-click="${this.H(() => setKey('format', f[0]))}"><span style="display:flex;gap:10px;align-items:center"><svg width="40" height="54" viewBox="0 0 40 54" aria-hidden="true"><rect x="2" y="2" width="36" height="50" fill="#fff" stroke="#141414" stroke-width="2.5"/>${pic}</svg><span style="font-family:'Bangers',Impact,sans-serif;font-size:20px;letter-spacing:.04em">${f[1]}</span></span><span style="font-size:14px;font-weight:700">${f[2]}</span></button>`;
    };
    const lessonIdeas = ['A promise is a small piece of dharma', 'True wealth is what we share', 'A calm mind sees clearly', 'Small and wise can beat big and proud'];
    return `<div style="max-width:900px;display:flex;flex-direction:column;gap:26px">
      ${this.stepHead(5, 'Katha', 'The story and its lesson', "Claude writes a page-by-page outline from everything you've set up. You can change any page before pictures are drawn.")}
      <fieldset><legend class="label">Inspired by <span class="muted" style="font-weight:400">(choose any)</span></legend><div class="row">${each(INSPIRATIONS, (v) => `<button class="chip" ${pressed(setup.inspiration.indexOf(v) >= 0)} data-click="${this.H(() => this.updateSetup((x) => Object.assign({}, x, { inspiration: x.inspiration.indexOf(v) >= 0 ? x.inspiration.filter((y) => y !== v) : x.inspiration.concat([v]) })))}">${esc(v)}</button>`)}</div></fieldset>
      <div><label class="label" for="katha">Main story or plot</label><textarea class="input" id="katha" rows="6" placeholder="e.g. Chiku promised Neela she could always shelter on his island. When the other monkeys object, Chiku must choose between fitting in and keeping his word." data-input="${this.H((e) => { setKey('katha', e.target.value); if (this.state.kathaError) this.setState({ kathaError: false }); })}">${esc(setup.katha)}</textarea>
        ${when(s.kathaError, '<p class="err" role="alert">Add a few sentences about the plot first.</p>')}</div>
      <div><label class="label" for="lesson">Life lesson (seekh)</label><input class="input" id="lesson" value="${esc(setup.lesson)}" placeholder="e.g. A promise is a small piece of dharma we carry with us" data-input="${this.H((e) => setKey('lesson', e.target.value))}">
        <div class="row" style="gap:8px;margin-top:10px">${each(lessonIdeas, (t) => `<button class="chip chip-sm chip-light" data-click="${this.H(() => setKey('lesson', t))}">${esc(t)}</button>`)}</div></div>
      <fieldset><legend class="label">Darshan lens <span class="muted" style="font-weight:400">(optional: the philosophical thread under the story)</span></legend>${chipRow(DARSHANS, (v) => setup.darshan === v, 'darshan', false)}</fieldset>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:24px">
        <fieldset><legend class="label">Tone</legend>${chipRow(TONES, (v) => setup.tone === v, 'tone', true)}</fieldset>
        <fieldset><legend class="label">Reading age</legend>${chipRow(AGES, (v) => setup.age === v, 'age', true)}</fieldset>
        <fieldset><legend class="label">Pages (with cover and ending)</legend>${chipRow(COUNTS, (v) => setup.pageCount === v, 'pageCount', true, (v) => v + ' pages')}</fieldset>
        <fieldset><legend class="label">Art style</legend>${chipRow(STYLES, (v) => setup.style === v, 'style', true)}</fieldset>
      </div>
      <fieldset style="display:flex;flex-direction:column;gap:12px"><legend class="label">Page format</legend>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px">${each([['auto', 'Auto', 'Picks per story: simple tales get single scenes, richer ones get comic grids.'], ['single', 'Single scene', 'One picture per page with a short caption below.'], ['grid', '3×2 comic grid', 'Six panels per page, each with a speech bubble.']], formatCard)}</div>
        <div class="note"><span>${esc(fmt.reason)}</span></div></fieldset>
      <div class="panel" style="padding:18px;display:flex;flex-direction:column;gap:10px;background:#FFFDF8"><h2 class="h2">Your katha at a glance</h2>
        <dl style="margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 16px">${each(glance, (g) => `<dt style="font-weight:700">${g[0]}</dt><dd style="margin:0">${esc(g[1])} <button class="linkbtn" style="min-height:auto;font-size:15px" data-click="${this.H(() => this.go(g[2]))}">edit</button></dd>`)}</dl></div>
      ${when(miss.length, () => `<div class="note note-warn" role="status"><span><strong>Before writing:</strong> add ${esc(this.joinNames(miss))}.</span></div>`)}
      <div class="row" style="justify-content:space-between;gap:12px"><button class="btn" data-click="${this.H(() => this.go('paristhiti'))}">Back</button><button class="btn btn-primary btn-lg" ${dis(miss.length)} data-click="${this.H(() => this.writeStory())}">${st.pages.length ? 'Write a new draft' : 'Write my katha'}</button></div>
    </div>`;
  }

  vWriting() {
    const s = this.state, w = s.writing;
    if (!w) return '';
    if (w.error) return `<div style="max-width:720px;margin:24px auto 0"><div class="panel" role="alert" style="padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start"><h1 class="h1">The katha didn't come together</h1><p style="margin:0">${esc(w.error)} No pictures were drawn, and everything you set up is saved.</p><div class="row"><button class="btn btn-primary" data-click="${this.H(() => this.writeStory(true))}">Try again</button><button class="btn" data-click="${this.H(() => this.go('katha', { writing: null }))}">Change the katha</button></div></div></div>`;
    const total = s.dev.realistic ? 45000 : 9000;
    const frac = Math.min(0.96, w.elapsed / total);
    const labels = ['Reading the desh and kaal', 'Placing your paatra', 'Weaving in the paristhiti', 'Writing the katha, page by page', 'Laying out panels and bubbles', 'Checking the seekh and reading level'];
    const th = [0, 0.1, 0.25, 0.45, 0.7, 0.88];
    const secs = Math.floor(w.elapsed / 1000);
    return `<div style="max-width:720px;margin:24px auto 0"><div class="panel" style="padding:28px;display:flex;flex-direction:column;gap:20px" role="status" aria-live="polite">
      <h1 class="display" style="font-size:54px">Writing your katha<span class="bounce" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
      <div class="progress" aria-hidden="true"><span style="width:${Math.round(frac * 100)}%"></span></div>
      <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">${each(labels, (l, i) => { const done = frac >= (th[i + 1] || 1.01); const active = !done && frac >= th[i]; return `<li style="display:flex;gap:12px;align-items:center;font-weight:700;opacity:${done || active ? 1 : 0.5}"><span style="width:30px;height:30px;border:3px solid #141414;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${done ? '#FFD93B' : '#fff'};flex:0 0 auto">${done ? ICON.check : active ? '<span class="dot pulse" aria-hidden="true"></span>' : ''}</span>${l}</li>`; })}</ol>
      <p class="muted" style="margin:0">${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} elapsed · usually 30 to 60 seconds. You can leave this page; we'll keep writing.</p>
      <button class="btn" style="align-self:flex-start" data-click="${this.H(() => this.cancelWriting())}">Cancel</button></div></div>`;
  }

  vPanelEditors(st, p, keyFn) {
    const named = st.characters.filter((c) => c.name);
    return each(p.panels || [], (pn, k) => `<li style="border:3px solid #141414;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#FFFDF8">
      <span style="font-family:'Bangers',Impact,sans-serif;font-size:18px;letter-spacing:.04em">Panel ${k + 1}</span>
      <div><label class="label" style="font-size:15px" for="pb-${pn.id}">Speech bubble</label><input class="input" style="font-size:15px;min-height:44px" id="pb-${pn.id}" value="${esc(pn.bubble)}" placeholder="Leave empty for no bubble" data-input="${this.H((e) => this.updatePanel(st.id, p.id, pn.id, { bubble: e.target.value }))}"></div>
      <div class="row" style="gap:6px"><span style="font-size:14px;font-weight:700">Said by:</span>${each([{ id: '', name: 'Narrator' }].concat(named), (o) => `<button class="chip chip-sm" style="min-height:36px;font-size:13px" ${pressed((pn.speakerId || '') === o.id)} data-click="${this.H(() => this.updatePanel(st.id, p.id, pn.id, { speakerId: o.id }))}">${esc(o.name)}</button>`)}</div>
      <div><label class="label" style="font-size:15px" for="pp-${pn.id}">Panel prompt</label><textarea class="input mono" style="font-size:13px" id="pp-${pn.id}" rows="2" ${keyFn ? `data-key="${this.H(keyFn)}"` : ''} data-input="${this.H((e) => this.updatePanel(st.id, p.id, pn.id, { prompt: e.target.value }))}">${esc(pn.prompt)}</textarea></div></li>`);
  }
  layoutChips(p, withFull) {
    return each([['caption', 'Single scene'], ['grid', '3×2 comic grid']].concat(withFull ? [['full', 'Full picture']] : []), (l) => `<button class="chip chip-sm" ${pressed((p.layout || 'caption') === l[0])} data-click="${this.H(() => this.setLayout(p, l[0]))}">${l[1]}</button>`);
  }

  vOutline(st) {
    const s = this.state, pages = st.pages;
    const midCount = pages.filter((p) => p.kind === 'middle').length;
    const pending = st.characters.filter((c) => c.sheet.status !== 'approved');
    const toDraw = pages.filter((p) => p.status !== 'done');
    const gridN = toDraw.filter((p) => p.layout === 'grid' && p.kind === 'middle').length;
    const row = (p, i) => {
      const isMid = p.kind === 'middle', isGrid = isMid && p.layout === 'grid';
      const label = this.pageLabel(p, i);
      const open = !!s.openPanels[p.id];
      return `<li class="panel" style="padding:0;overflow:hidden">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:4px solid #141414;background:${p.kind === 'cover' ? '#1F4FB8' : p.kind === 'end' ? '#FF4A3D' : '#FFD93B'}">
          <div class="row" style="gap:8px"><h2 class="h2" style="font-size:22px;color:${p.kind === 'cover' ? '#fff' : '#141414'}">${label}</h2>${when(p.location, () => `<span class="badge">At: ${esc(p.location)}</span>`)}</div>
          <div class="row" style="gap:6px">
            ${when(isMid, () => `<button class="btn btn-sm icon-btn" aria-label="Move ${label} up" ${dis(i <= 1)} data-click="${this.H(() => this.movePage(p.id, -1))}">${ICON.up}</button><button class="btn btn-sm icon-btn" aria-label="Move ${label} down" ${dis(i >= pages.length - 2)} data-click="${this.H(() => this.movePage(p.id, 1))}">${ICON.down}</button>`)}
            <button class="btn btn-sm" ${dis(p.rewriting)} data-click="${this.H(() => this.rewritePage(p))}">${when(p.rewriting, '<span class="spin spin-sm" aria-hidden="true"></span>')}${p.rewriting ? 'Rewriting…' : 'Rewrite this page'}</button>
            ${when(isMid, () => `<button class="btn btn-sm" aria-label="Delete ${label}" ${dis(midCount <= 1)} data-click="${this.H(() => this.deletePage(p.id))}">Delete</button>`)}
          </div></div>
        <div style="padding:14px;display:flex;flex-direction:column;gap:14px;opacity:${p.rewriting ? 0.55 : 1}">
          ${when(isMid, () => `<div class="row" style="gap:8px"><span class="label" style="margin:0">Format:</span>${this.layoutChips(p, false)}</div>`)}
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px">
            <div><label class="label" for="cap-${p.id}">${p.kind === 'cover' ? 'Cover title' : isGrid ? 'Narration (top of page)' : p.kind === 'end' ? 'Closing line and seekh' : 'Caption'}</label><textarea class="input" id="cap-${p.id}" rows="3" ${dis(p.rewriting)} data-input="${this.H((e) => { const v = e.target.value; if (p.kind === 'cover') this.updateStory(st.id, (x) => Object.assign({}, x, { title: v, pages: x.pages.map((q) => (q.id === p.id ? Object.assign({}, q, { caption: v }) : q)) })); else this.updatePage(st.id, p.id, { caption: v }); })}">${esc(p.caption)}</textarea></div>
            ${when(!isGrid, () => `<div><label class="label" for="pr-${p.id}">Picture prompt</label><textarea class="input mono" id="pr-${p.id}" rows="4" ${dis(p.rewriting)} data-input="${this.H((e) => this.updatePage(st.id, p.id, { imagePrompt: e.target.value }))}">${esc(p.imagePrompt)}</textarea></div>`)}
          </div>
          ${when(isGrid, () => `<div><button class="linkbtn" style="font-weight:700;display:flex;gap:8px;align-items:center;text-decoration:none" aria-expanded="${open}" data-click="${this.H(() => this.setState((ss) => ({ openPanels: Object.assign({}, ss.openPanels, { [p.id]: !open }) })))}"><span aria-hidden="true" style="font-family:'Bangers',Impact,sans-serif;font-size:22px;width:28px;height:28px;border:3px solid #141414;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:#FFD93B;color:#141414">${open ? '–' : '+'}</span><span style="color:#141414;text-decoration:underline">6 panels with speech bubbles</span></button>
            ${when(open, () => `<ol style="list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px">${this.vPanelEditors(st, p)}</ol>`)}</div>`)}
        </div>
        ${when(p.kind !== 'end' && pages.length < 14, () => `<div style="border-top:3px dashed #141414;padding:6px 14px"><button class="linkbtn" data-click="${this.H(() => this.addPageAfter(p.id))}">+ Add a page after this one</button></div>`)}
      </li>`;
    };
    return `<div class="stack" style="gap:22px">
      <div class="row" style="align-items:flex-end;justify-content:space-between;gap:16px"><div style="flex:1 1 420px;min-width:0"><h1 class="h1">Review the katha</h1><p class="muted" style="margin:8px 0 0;max-width:64ch">No pictures have been drawn yet. Edit captions, speech bubbles and prompts; reorder, rewrite or switch a page between a single scene and a six-panel grid.</p></div><button class="btn btn-sm" data-click="${this.H(() => this.writeStory())}">Write a new draft</button></div>
      <div style="max-width:640px"><label class="label" for="story-title">Book title</label><input class="input" id="story-title" style="font-family:'Bangers',Impact,sans-serif;font-size:26px;letter-spacing:.03em" value="${esc(st.title)}" data-input="${this.H((e) => { const v = e.target.value; this.updateStory(st.id, (x) => Object.assign({}, x, { title: v, pages: x.pages.map((p, i) => (i === 0 ? Object.assign({}, p, { caption: v }) : p)) })); })}"></div>
      <div class="note"><span><strong>Seekh:</strong> ${esc(this.clean(st.setup.lesson) || '[none set: add one on the Katha step]')}</span></div>
      <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px">${each(pages, row)}</ol>
      <div class="panel row" style="padding:18px;gap:14px;justify-content:space-between;background:#FFFDF8"><div style="flex:1 1 320px"><p style="margin:0;font-weight:700">This will draw ${toDraw.length} pages, cover first${gridN ? ' (' + gridN + ' of them as six-panel grids)' : ''}.</p>
        ${when(pending.length, () => `<p class="err" style="margin:4px 0 0">Approve every character sheet first: ${esc(pending.map((c) => c.name || ROLE_LABELS[c.role]).join(', '))}. <button class="linkbtn" style="min-height:auto" data-click="${this.H(() => this.go('paatra'))}">Go to paatra</button></p>`)}</div>
        <button class="btn btn-primary btn-lg" ${dis(pending.length)} data-click="${this.H(() => this.startIllustrating())}">Draw the pictures</button></div>
    </div>`;
  }

  vIllustrate(st) {
    const pages = st.pages;
    const cnt = (k) => pages.filter((p) => p.status === k).length;
    const nDone = cnt('done'), nFailed = cnt('failed');
    const pct = pages.length ? Math.round((nDone + nFailed) / pages.length * 100) : 0;
    const allDone = pages.length > 0 && nDone === pages.length;
    const starring = this.starring(st);
    return `<div class="stack" style="gap:22px">
      <div class="row" style="align-items:flex-end;justify-content:space-between;gap:16px"><div style="flex:1 1 380px"><h1 class="h1">${allDone ? 'Every picture is drawn' : 'Drawing your pictures'}</h1><p class="muted" style="margin:8px 0 0">Cover first, then three pages at a time. Grid pages draw all six panels together. Click any page to edit or redraw it.</p></div>
        <div class="row">${when(nFailed, () => `<button class="btn" data-click="${this.H(() => this.retryFailed())}">Retry failed pages</button>`)}${when(allDone, () => `<button class="btn btn-primary" data-click="${this.H(() => this.go('reader', { readerIndex: 0 }))}">Read the book</button>`)}</div></div>
      <div class="stack" style="gap:8px"><div style="display:flex;justify-content:space-between;font-weight:700"><span>${nDone} of ${pages.length} pages drawn</span><span>${pct}%</span></div>
        <div class="progress" role="progressbar" aria-label="Pictures drawn" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
        <div class="row" style="gap:8px"><span class="badge b-done">${nDone} done</span><span class="badge b-drawing">${cnt('drawing')} drawing</span><span class="badge b-queued">${cnt('queued')} queued</span><span class="badge b-failed">${nFailed} failed</span></div></div>
      <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:30px 24px">${each(pages, (p, i) => {
        const v = this.activeVersion(p);
        const statusLabel = p.status === 'none' ? 'Not started' : p.status === 'done' ? 'Done' : p.status === 'failed' ? 'Failed' : p.status === 'drawing' ? 'Drawing' : 'Queued';
        const label = this.pageLabel(p, i) + (p.kind === 'middle' && p.layout === 'grid' ? ' · grid' : '');
        const open = this.H(() => this.go('editor', { editorIndex: i }));
        return `<li class="stack" style="gap:8px"><button class="tile" aria-label="Edit ${label}, ${statusLabel}" data-click="${open}"><div class="lift" style="box-shadow:5px 5px 0 #141414">${pagePanel(this.panelData(st, p), st.title, starring, p.kind === 'middle' ? String(i + 1) : '')}</div></button>
          <div class="row" style="gap:6px;justify-content:space-between"><span style="font-weight:700">${label}</span><span class="badge b-${p.status}">${when(p.status === 'drawing', '<span class="dot pulse" aria-hidden="true"></span>')}${statusLabel}</span></div>
          ${when(v && v.note && p.status === 'done', () => `<span class="badge b-note" style="align-self:flex-start" title="${esc(v.note)}">Fallback used</span>`)}
          ${when(p.status === 'failed', `<button class="btn btn-sm" data-click="${open}">Edit prompt &amp; redraw</button>`)}</li>`;
      })}</ul></div>`;
  }

  vEditor(st) {
    const s = this.state, pages = st.pages;
    const ei = Math.min(s.editorIndex, Math.max(0, pages.length - 1));
    const ep = pages[ei];
    if (!ep) return '';
    const av = this.activeVersion(ep);
    const isMid = ep.kind === 'middle', isGrid = isMid && ep.layout === 'grid';
    const starring = this.starring(st);
    const key = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); this.redrawCurrent(); } };
    return `<div class="stack" style="gap:18px">
      <div class="row" style="justify-content:space-between"><button class="btn btn-sm" data-click="${this.H(() => this.go('illustrate'))}">All pages</button>
        <div class="row" style="gap:8px"><button class="btn btn-sm icon-btn" aria-label="Previous page" ${dis(ei === 0)} data-click="${this.H(() => this.setState({ editorIndex: ei - 1 }))}">${ICON.left}</button><span style="font-weight:700;min-width:110px;text-align:center">${this.pageLabel(ep, ei)}</span><button class="btn btn-sm icon-btn" aria-label="Next page" ${dis(ei === pages.length - 1)} data-click="${this.H(() => this.setState({ editorIndex: ei + 1 }))}">${ICON.right}</button></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">
        <div style="flex:1 1 320px;max-width:460px;min-width:0;display:flex;flex-direction:column;gap:14px">
          <div style="box-shadow:7px 7px 0 #141414">${pagePanel(this.panelData(st, ep), st.title, starring, isMid ? String(ei + 1) : '')}</div>
          ${when(ep.versions.length > 1, () => `<div><h2 class="label">Versions</h2><div style="display:flex;gap:12px;overflow-x:auto;padding:4px 4px 10px">${each(ep.versions, (v, k) => { const act = v.id === (av && av.id); return `<button class="tile" style="width:86px;flex:0 0 auto" ${pressed(act)} aria-label="Use version ${k + 1}" data-click="${this.H(() => this.updatePage(st.id, ep.id, { activeVersionId: v.id }))}"><div style="outline:${act ? '4px solid #1F4FB8' : '0 solid transparent'};outline-offset:3px">${pagePanel(Object.assign(this.panelData(st, ep, v), { bubble: '' }), st.title, starring)}</div><span style="display:block;text-align:center;font-weight:700;font-size:14px;margin-top:6px">v${k + 1}${v.note ? ' · fallback' : ''}</span></button>`; })}</div></div>`)}
        </div>
        <div style="flex:999 1 380px;min-width:0;display:flex;flex-direction:column;gap:18px">
          ${when(ep.status === 'drawing', '<div class="note" role="status"><span class="spin" aria-hidden="true"></span><strong>Drawing a new version…</strong></div>')}
          ${when(ep.status === 'done' && av && av.note, () => `<div class="note" role="status">${ICON.info}<span><strong>Heads up:</strong> ${esc(av.note)}</span></div>`)}
          ${when(ep.status === 'failed', () => `<div class="note note-err" role="alert" style="flex-direction:column;gap:6px"><strong>We couldn't draw this page.</strong><span>The image service declined it every way we tried: with the reference images, without them, and from text only (${esc(ep.error ? ep.error.code : '')}). Simplifying the prompt usually fixes it: describe the scene plainly and remove anything that could read as unsafe.</span><button class="linkbtn" style="align-self:flex-start" data-click="${this.H(() => { const el = document.getElementById(isGrid ? 'pp-' + ep.panels[0].id : 'ed-prompt'); if (el) el.focus(); })}">Edit the prompt below, then redraw</button></div>`)}
          <div><label class="label" for="ed-caption">${ep.kind === 'cover' ? 'Cover title' : isGrid ? 'Narration' : 'Caption'}</label><textarea class="input" id="ed-caption" rows="3" data-input="${this.H((e) => { const v = e.target.value; if (ep.kind === 'cover') this.updateStory(st.id, (x) => Object.assign({}, x, { title: v, pages: x.pages.map((q) => (q.id === ep.id ? Object.assign({}, q, { caption: v }) : q)) })); else this.updatePage(st.id, ep.id, { caption: v }); })}">${esc(ep.caption)}</textarea></div>
          ${when(isMid, () => `<fieldset><legend class="label">Format</legend><div class="row" style="gap:8px">${this.layoutChips(ep, true)}</div></fieldset>`)}
          ${when(isMid && !isGrid, () => `<div><label class="label" for="ed-bubble">Speech bubble <span class="muted" style="font-weight:400">(optional, real text over the picture)</span></label><input class="input" id="ed-bubble" value="${esc(ep.bubble)}" placeholder="e.g. &quot;I gave my word, Neela.&quot;" data-input="${this.H((e) => this.updatePage(st.id, ep.id, { bubble: e.target.value }))}"></div>`)}
          ${when(isGrid, () => `<div class="stack" style="gap:10px"><h2 class="label" style="margin:0">Panels</h2><ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">${this.vPanelEditors(st, ep, key)}</ol></div>`)}
          ${when(!isGrid, () => `<div><label class="label" for="ed-prompt">Picture prompt</label><textarea class="input mono" id="ed-prompt" rows="6" data-key="${this.H(key)}" data-input="${this.H((e) => this.updatePage(st.id, ep.id, { imagePrompt: e.target.value }))}">${esc(ep.imagePrompt)}</textarea></div>`)}
          <p class="hint" style="margin:0">Pictures never include words; captions and bubbles are added as text. Press Ctrl + Enter in a prompt to redraw.</p>
          <div class="row"><button class="btn btn-primary btn-lg" ${dis(ep.status === 'drawing')} data-click="${this.H(() => this.redrawCurrent())}">${ep.versions.length ? (isGrid ? 'Redraw all 6 panels' : 'Redraw') : 'Draw this page'}</button><span class="hint" style="margin:0">Earlier versions are kept below the page.</span></div>
        </div></div></div>`;
  }

  vReaderCore(st) {
    const s = this.state, pages = st.pages;
    const ri = Math.min(s.readerIndex, Math.max(0, pages.length - 1));
    const rp = pages[ri];
    if (!rp) return '';
    return `<div style="width:100%;max-width:540px;box-shadow:8px 8px 0 #141414">${pagePanel(this.panelData(st, rp), st.title, this.starring(st), rp.kind === 'middle' ? String(ri + 1) : '')}</div>
      <div class="row" style="gap:14px"><button class="btn btn-lg" aria-label="Previous page" ${dis(ri === 0)} data-click="${this.H(() => this.setReader(ri - 1))}">${ICON.left}</button><span role="status" style="font-weight:700;min-width:110px;text-align:center">Page ${ri + 1} of ${pages.length}</span><button class="btn btn-lg btn-primary" id="reader-next" aria-label="Next page" ${dis(ri === pages.length - 1)} data-click="${this.H(() => this.setReader(ri + 1))}">${ICON.right}</button></div>`;
  }
  readerKey() { return this.H((e) => { const ri = this.state.readerIndex; if (e.key === 'ArrowRight') { e.preventDefault(); this.setReader(ri + 1); } if (e.key === 'ArrowLeft') { e.preventDefault(); this.setReader(ri - 1); } }); }
  vReader(st) {
    const s = this.state;
    return `<div class="stack" style="gap:18px;align-items:center" data-key="${this.readerKey()}">
      <div class="row" style="justify-content:center"><button class="btn btn-sm" ${pressed(s.speaking)} data-click="${this.H(() => this.toggleSpeak())}">${s.speaking ? 'Stop reading' : 'Read aloud'}</button><button class="btn btn-sm" data-click="${this.H(() => this.setState({ exportOpen: true }))}">Export PDF</button><button class="btn btn-sm btn-blue" data-click="${this.H(() => this.openShare())}">Share link</button><button class="btn btn-sm btn-quiet" data-click="${this.H(() => this.go('illustrate'))}">Edit pages</button></div>
      ${this.vReaderCore(st)}
      <p class="hint" style="margin:0">Tip: use the left and right arrow keys while a button is focused.</p></div>`;
  }
  vShared(st) {
    const s = this.state;
    return `<div style="background:#1F4FB8;color:#fff;border-bottom:5px solid #141414;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span style="font-weight:700">A storybook shared with you · read-only</span><button class="btn btn-sm" data-click="${this.H(() => this.go('library'))}">Back to my library (owner preview)</button></div>
      <main style="max-width:640px;margin:0 auto;padding:28px 20px 80px;display:flex;flex-direction:column;gap:18px;align-items:center" data-key="${this.readerKey()}"><h1 class="h1" style="text-align:center">${esc(st.title)}</h1>${this.vReaderCore(st)}<button class="btn btn-sm" ${pressed(s.speaking)} data-click="${this.H(() => this.toggleSpeak())}">${s.speaking ? 'Stop reading' : 'Read aloud'}</button></main>`;
  }

  vDialogs(st) {
    const s = this.state;
    const esc_ = this.H((e) => { if (e.key === 'Escape') this.setState({ exportOpen: false, confirm: null, share: Object.assign({}, s.share, { open: false }) }); });
    let out = '';
    if (s.exportOpen && st) out += `<div class="overlay" data-key="${esc_}"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="exp-title" style="width:100%;max-width:460px;padding:24px;display:flex;flex-direction:column;gap:16px">
      <h2 class="h1" id="exp-title" style="font-size:34px">Print-ready PDF</h2><p style="margin:0">One page per sheet, no buttons or menus. Choose “Save as PDF” in the print dialog.</p>
      <fieldset><legend class="label">Paper size</legend><div class="row"><button class="chip" ${pressed(s.paper === 'a4')} data-click="${this.H(() => this.setState({ paper: 'a4' }))}">A4</button><button class="chip" ${pressed(s.paper === 'letter')} data-click="${this.H(() => this.setState({ paper: 'letter' }))}">US Letter</button></div></fieldset>
      <p class="hint" style="margin:0">${st.pages.length} pages, ${s.paper === 'a4' ? 'A4 (210 × 297 mm)' : 'US Letter (8.5 × 11 in)'}.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="exp-cancel" data-click="${this.H(() => this.setState({ exportOpen: false }))}">Cancel</button><button class="btn btn-primary" data-click="${this.H(() => { this.setState({ exportOpen: false }); this.later(() => window.print(), 150); })}">Open print dialog</button></div></div></div>`;
    if (s.share.open) out += `<div class="overlay" data-key="${esc_}"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="share-title" style="width:100%;max-width:520px;padding:24px;display:flex;flex-direction:column;gap:16px">
      <h2 class="h1" id="share-title" style="font-size:34px">Share a read-only link</h2><p style="margin:0">Anyone with the link can read the book. They can't edit it, and reference images are never included.</p>
      ${when(s.share.busy, '<div class="note" role="status"><span class="spin" aria-hidden="true"></span>Creating link…</div>')}
      ${when(s.share.url, () => `<div><label class="label" for="share-url">Link</label><div class="row" style="gap:8px"><input class="input mono" id="share-url" readonly value="${esc(s.share.url)}" style="flex:1 1 240px"><button class="btn btn-primary" data-click="${this.H(() => this.copyShare())}">${s.share.copied ? 'Copied' : 'Copy link'}</button></div></div>`)}
      ${when(s.share.error, '<div class="note note-err" role="alert">Couldn\'t create a link right now. Check your connection and try again.</div>')}
      <div class="row" style="justify-content:flex-end"><button class="btn" data-click="${this.H(() => this.setState({ share: Object.assign({}, s.share, { open: false }) }))}">Close</button>${when(s.share.url, () => `<button class="btn btn-blue" data-click="${this.H(() => this.go('shared', { share: Object.assign({}, s.share, { open: false }), readerIndex: 0 }))}">Preview as a guest</button>`)}</div></div></div>`;
    if (s.confirm) out += `<div class="overlay" style="z-index:60" data-key="${esc_}"><div class="panel" role="alertdialog" aria-modal="true" aria-labelledby="cf-title" style="width:100%;max-width:440px;padding:24px;display:flex;flex-direction:column;gap:14px">
      <h2 class="h2" id="cf-title" style="font-size:30px">${esc(s.confirm.title)}</h2><p style="margin:0">${esc(s.confirm.body)}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="cf-no" data-click="${this.H(() => this.setState({ confirm: null }))}">Keep it</button><button class="btn btn-red" data-click="${this.H(() => { const c = s.confirm; this.setState({ confirm: null }); if (c && c.run) c.run(); })}">${esc(s.confirm.yes)}</button></div></div></div>`;
    return out;
  }
  vToasts() {
    return `<div aria-live="polite" style="position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:10px;align-items:flex-end;max-width:calc(100% - 32px)">${each(this.state.toasts, (t) => `<div class="toast ${t.kind === 'warn' ? 't-warn' : ''}"><span style="flex:1 1 auto">${esc(t.text)}</span>${when(t.action, () => `<button class="linkbtn" data-click="${this.H(() => { t.action.run(); this.dismissToast(t.id); })}">${esc(t.action.label)}</button>`)}<button class="linkbtn" style="text-decoration:none;font-size:20px;line-height:1;min-height:auto" aria-label="Dismiss" data-click="${this.H(() => this.dismissToast(t.id))}">×</button></div>`)}</div>`;
  }
  vDev() {
    const s = this.state, d = s.dev;
    const setDev = (patch, cb) => this.setState({ dev: Object.assign({}, this.state.dev, patch) }, cb);
    const chip = (label, on, fn) => `<button class="chip chip-sm" ${pressed(on)} data-click="${this.H(fn)}">${label}</button>`;
    const jumps = [['landing', 'Landing'], ['signin', 'Sign in'], ['library', 'Library'], ['desh', 'Desh'], ['kaal', 'Kaal'], ['paatra', 'Paatra'], ['paristhiti', 'Paristhiti'], ['katha', 'Katha'], ['writing', 'Writing'], ['outline', 'Outline'], ['illustrate', 'Pictures'], ['editor', 'Page editor'], ['reader', 'Reader'], ['shared', 'Shared view']];
    return `<div style="position:fixed;left:16px;bottom:16px;z-index:65;display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:calc(100% - 32px)">
      ${when(d.open, () => `<div class="panel" style="width:320px;max-width:100%;max-height:70vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;font-size:15px">
        <div><h2 class="h2" style="font-size:22px">Mock mode</h2><p class="hint" style="margin:2px 0 0">No backend, no keys. Simulated jobs, delays and failures.</p></div>
        <fieldset><legend class="label">Image results</legend><div class="row" style="gap:6px">${chip('Always works', d.failMode === 'none', () => setDev({ failMode: 'none' }))}${chip('Realistic refusals', d.failMode === 'some', () => setDev({ failMode: 'some' }))}${chip('Always refused', d.failMode === 'all', () => setDev({ failMode: 'all' }))}</div></fieldset>
        <fieldset><legend class="label">Library</legend><div class="row" style="gap:6px">${each([['normal', 'Normal'], ['slow', 'Slow'], ['empty', 'Empty'], ['error', 'Error']], (o) => chip(o[1], d.library === o[0], () => setDev({ library: o[0] }, () => { if (this.state.screen === 'library') this.loadLibrary(); })))}</div></fieldset>
        <div class="row" style="gap:6px">${chip('Story job fails', d.storyFail, () => setDev({ storyFail: !d.storyFail }))}${chip('Real timings (45 s story)', d.realistic, () => setDev({ realistic: !d.realistic }))}${chip('Offline', d.offline, () => this.toggleOffline())}</div>
        <fieldset><legend class="label">Jump to screen</legend><div class="row" style="gap:6px">${each(jumps, (j) => `<button class="chip chip-sm" data-click="${this.H(() => this.jumpTo(j[0]))}">${j[1]}</button>`)}</div></fieldset>
        <button class="linkbtn" style="align-self:flex-start" data-click="${this.H(() => this.resetDemo())}">Reset demo data</button></div>`)}
      <button class="btn btn-sm btn-dark" aria-expanded="${d.open}" data-click="${this.H(() => setDev({ open: !d.open }))}">Mock mode</button></div>`;
  }
  vPrint(st) {
    const starring = this.starring(st);
    return `<div class="print-only ${this.state.paper === 'a4' ? 'print-a4' : 'print-letter'}">${each(st.pages, (p, i) => `<div class="print-page"><div>${pagePanel(this.panelData(st, p), st.title, starring, p.kind === 'middle' ? String(i + 1) : '')}</div></div>`)}</div>`;
  }
}

window.app = new App(document.getElementById('app'));
window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (h && h !== 'how') window.app.jumpTo(h); });
</script>
</body>
</html>

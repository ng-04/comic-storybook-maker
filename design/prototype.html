<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comic Storybook Maker v2 · prototype (mock mode)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--yellow:#FFD93B;--red:#FF4A3D;--blue:#1F4FB8;--purple:#8A4FD1;--paper:#F3EEE4;--page:#FFFDF8;--info:#E6EEFF;--warn:#FFF4C2;--errbg:#FFE7E3;--err:#B3261E;--muted:#4A4A4A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper)}
a{color:var(--blue)}a:hover{color:var(--ink)}
.app{font-family:'Comic Neue','Comic Sans MS','Chalkboard SE',sans-serif;color:var(--ink);background-color:var(--paper);background-image:radial-gradient(rgba(20,20,20,.10) 1.2px,transparent 1.7px);background-size:14px 14px;min-height:100vh;font-size:17px;line-height:1.45}
.display{font-family:'Bangers',Impact,'Arial Black',sans-serif;font-weight:400;letter-spacing:.02em;line-height:.95;margin:0;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);text-wrap:balance}
.h1{font-family:'Bangers',Impact,sans-serif;font-weight:400;letter-spacing:.03em;font-size:40px;line-height:1;margin:0;text-wrap:balance}
.h2{font-family:'Bangers',Impact,sans-serif;font-weight:400;letter-spacing:.04em;font-size:26px;line-height:1.05;margin:0}
.kicker{font-family:'Bangers',Impact,sans-serif;font-weight:400;letter-spacing:.08em;font-size:20px;color:var(--blue);margin:0}
.muted{color:var(--muted)}
.panel{background:#fff;border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:6px}
.btn{font-family:'Bangers',Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:.05em;min-height:48px;padding:0 20px;border:4px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.chip:focus-visible,.input:focus-visible,.linkbtn:focus-visible,.tile:focus-visible,.pa:focus-visible,.gtog:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.btn[disabled],.chip[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--ink)}
.btn-primary{background:var(--yellow)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{color:#fff}
.btn-red{background:var(--red)}
.btn-sm{min-height:44px;font-size:17px;padding:0 14px;border-width:3px;box-shadow:3px 3px 0 var(--ink)}
.btn-lg{min-height:60px;font-size:26px;padding:0 28px}
.btn-quiet{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;text-underline-offset:4px}
.btn-quiet:hover{box-shadow:none;transform:none;background:rgba(20,20,20,.06)}
.btn-dark{background:var(--ink);color:var(--yellow);box-shadow:3px 3px 0 var(--yellow)}.btn-dark:hover{color:var(--yellow);box-shadow:4px 4px 0 var(--yellow)}
.icon-btn{width:44px;padding:0}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}
.input{font:inherit;font-size:17px;color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:10px 12px;background:#fff;width:100%;min-height:48px}
textarea.input{resize:vertical;line-height:1.4}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px}
.label{display:block;font-weight:700;margin:0 0 6px}
.hint{font-size:15px;color:var(--muted);margin:6px 0 0}
.err{font-size:15px;font-weight:700;color:var(--err);margin:6px 0 0}
.chip{font:inherit;font-weight:700;font-size:16px;min-height:44px;padding:0 14px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
.chip-sm{min-height:40px;font-size:14px;padding:0 10px}
.chip-light{font-weight:400}
.gtog{font:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;min-width:84px;border:3px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.gtog[aria-pressed="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
.pa{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;min-height:64px;border:3px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;width:100%}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;line-height:1;padding:6px 10px;border:3px solid var(--ink);border-radius:999px;background:#fff;white-space:nowrap}
.b-queued,.b-none{background:#fff;border-style:dashed}.b-drawing{background:var(--blue);color:#fff}.b-done{background:var(--yellow)}.b-failed{background:#FFD3CE}.b-note{background:var(--info)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block}
.pulse{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.spin{width:22px;height:22px;border:4px solid var(--ink);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:0 0 auto}
.spin-sm{width:16px;height:16px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:30px;border:4px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.progress>span{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--yellow) 0 14px,#FFE77A 14px 28px);border-right:4px solid var(--ink);transition:width .4s}
.bounce span{display:inline-block;animation:bounce 1s infinite}.bounce span:nth-child(2){animation-delay:.15s}.bounce span:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-10px)}}
.tile{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit}
.tile:hover .lift{transform:translate(-2px,-2px)}.lift{transition:transform .1s}
.toast{background:var(--ink);color:#fff;border:4px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--yellow);padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:700;max-width:420px}
.toast.t-warn{background:#fff;color:var(--ink);box-shadow:5px 5px 0 var(--red)}
.toast .linkbtn{color:var(--yellow);min-height:auto;white-space:nowrap}.toast.t-warn .linkbtn{color:var(--blue)}
.note{border:3px solid var(--ink);border-radius:10px;background:var(--info);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.note-err{background:var(--errbg)}.note-warn{background:var(--warn)}
.reftile{display:flex;gap:8px;align-items:center;border:3px solid var(--ink);border-radius:8px;background:#fff;padding:6px 6px 6px 10px;font-size:15px;max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.file-in:focus-visible+label{outline:4px solid var(--blue);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 120px}
.grid-auto{display:grid;gap:24px}
fieldset{border:0;margin:0;padding:0}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}
/* page panel */
.pp{container-type:inline-size;width:100%;aspect-ratio:210/297;border:max(2px,1.2cqw) solid var(--ink);position:relative;overflow:hidden;color:var(--ink);display:flex;flex-direction:column;padding:4cqw;gap:3cqw;font-family:'Comic Neue','Comic Sans MS',sans-serif;background-size:3.4cqw 3.4cqw}
.pp-title{margin:0;font-family:'Bangers',Impact,'Arial Black',sans-serif;font-weight:400;font-size:11cqw;line-height:.95;letter-spacing:.02em;color:var(--yellow);-webkit-text-stroke:.55cqw var(--ink);paint-order:stroke fill;text-shadow:1.1cqw 1.1cqw 0 var(--ink);text-align:center;text-wrap:balance}
.pp-art{flex:1 1 0;min-width:0;position:relative;border:max(2px,1.2cqw) solid var(--ink);background:#fff;overflow:hidden;box-shadow:1.4cqw 1.4cqw 0 var(--ink)}
.pp-art svg,.pp-art img,.pp-cell svg,.pp-cell img{display:block;width:100%;height:100%;object-fit:cover}
.pp-cap{margin:0;background:var(--yellow);border:max(2px,.9cqw) solid var(--ink);padding:2.4cqw 3cqw;font-weight:700;font-size:4.2cqw;line-height:1.3;text-wrap:pretty;box-shadow:1cqw 1cqw 0 var(--ink)}
.pp-over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:4cqw;font-family:'Bangers',Impact,sans-serif;font-size:6.5cqw;letter-spacing:.04em}
.pp-bubble{position:absolute;top:3cqw;left:3cqw;max-width:62%;background:#fff;border:max(2px,.9cqw) solid var(--ink);border-radius:5cqw;padding:2cqw 3.2cqw;font-weight:700;font-size:3.9cqw;line-height:1.25;box-shadow:.9cqw .9cqw 0 var(--ink)}
.pp-grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:2.4cqw}
.pp-cell{position:relative;min-height:0;border:max(1.5px,.9cqw) solid var(--ink);background:#fff;overflow:hidden;box-shadow:.9cqw .9cqw 0 var(--ink)}
.pp-cbub{position:absolute;top:1.4cqw;max-width:82%;background:#fff;border:max(1.5px,.6cqw) solid var(--ink);border-radius:3.5cqw;padding:1cqw 1.8cqw;font-weight:700;font-size:2.7cqw;line-height:1.2}
.pp-no{position:absolute;top:1.6cqw;right:1.6cqw;min-width:6cqw;height:6cqw;padding:0 1cqw;display:flex;align-items:center;justify-content:center;background:#fff;border:max(2px,.7cqw) solid var(--ink);border-radius:999px;font-weight:700;font-size:3.2cqw}
.pp-end{margin:0;font-family:'Bangers',Impact,'Arial Black',sans-serif;font-size:19cqw;line-height:.95;letter-spacing:.02em;color:#fff;-webkit-text-stroke:.7cqw var(--ink);paint-order:stroke fill;text-shadow:1.4cqw 1.4cqw 0 var(--ink);text-align:center}
.print-only{display:none}
@media (prefers-reduced-motion:reduce){.app *{animation:none!important;transition:none!important}}
@media print{
  .no-print{display:none!important}.print-only{display:block!important}
  body,.app{background:#fff!important;background-image:none!important}
  .print-page{break-after:page;page-break-after:always;display:flex;align-items:center;justify-content:center;height:100vh}
  .print-page:last-child{break-after:auto;page-break-after:auto}
  .print-a4 .print-page>div{width:190mm}.print-letter .print-page>div{width:7.2in}
}
</style>
<style id="page-size">@page{size:A4;margin:10mm}</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Comic Storybook Maker v2 — self-contained prototype (mock mode)
   One config flag. MOCK true = fake backend in this file.
   MOCK false = calls go to API_BASE via the http api (see README).
   No API keys or model names ever live in the front end.
   Tip: open with #paatra, #katha, #outline, #reader … to jump to a screen.
   ===================================================================== */
const CONFIG = { MOCK: true, API_BASE: '[YOUR_API_BASE_URL]' };

const INSPIRATIONS = ['Panchatantra', 'Jataka tales', 'Hitopadesha', 'Ramayana', 'Mahabharata', 'Puranas', 'Original tale'];
const ERAS = ['Long, long ago', 'Satya Yuga', 'Treta Yuga', 'Dvapara Yuga', 'Vedic age', 'Mauryan era', 'Gupta era', 'Present day'];
const RITUS = ['Vasant · spring', 'Grishma · summer', 'Varsha · monsoon', 'Sharad · autumn', 'Hemant · early winter', 'Shishir · winter'];
const DARSHANS = ['None', 'Nyaya · clear reasoning', 'Vaisheshika · how things are made', 'Samkhya · mind and nature', 'Yoga · discipline and focus', 'Mimamsa · right action', 'Vedanta · we are all one'];
const TONES = ['Adventurous', 'Funny', 'Heartwarming', 'Wise and calm', 'Gentle bedtime'];
const AGES = ['3–5', '5–7', '7–10'];
const COUNTS = [6, 8, 12];
const STYLES = ['Comic', 'Watercolour', 'Crayon', 'Madhubani-inspired'];
const COLORS = ['#1F4FB8', '#8A4FD1', '#2E9C5A', '#C98A4B', '#F28C28', '#D6457A'];
const ROLE_LABELS = { nayak: 'Nayak', sahayak: 'Sahayak', mitra: 'Mitra', guru: 'Guru', parivaar: 'Parivaar', pratinayak: 'Pratinayak' };
const ROLE_OPTIONS = [['nayak', 'Nayak (hero)'], ['sahayak', 'Sahayak (helper)'], ['mitra', 'Mitra (friend)'], ['guru', 'Guru (mentor)'], ['parivaar', 'Parivaar (family)'], ['pratinayak', 'Pratinayak (rival)']];
const FORMS = ['Human', 'Animal', 'Bird', 'Divine being'];
const PA = [
  { k: 'Dharma', hint: 'duty, righteousness, doing what is right', bg: '#1F4FB8', ink: '#FFFFFF', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4', q: 'What duty does {n} hold to?', ph: 'e.g. Keeping a promise to a friend' },
  { k: 'Artha', hint: 'resources, wealth, using things wisely', bg: '#FFD93B', ink: '#141414', icon: 'M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16zM9 8.5h6M9 11.5h6M10 11.5c3 0 3 4 0 4l4 0', q: 'What does {n} need, protect or share?', ph: 'e.g. The jamun fruit that feeds the whole tree' },
  { k: 'Kaam', hint: 'wishes, ambition, love for family and friends', bg: '#FF4A3D', ink: '#141414', icon: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z', q: 'What does {n} wish for?', ph: 'e.g. To be accepted by the other monkeys' },
  { k: 'Moksh', hint: 'inner peace, letting go, spiritual freedom', bg: '#8A4FD1', ink: '#FFFFFF', icon: 'M12 20c-4 0-8-3-9-7 3 0 6 1 9 4 3-3 6-4 9-4-1 4-5 7-9 7zM12 17c-2-3-2-7 0-11 2 4 2 8 0 11z', q: 'What must {n} let go of, or come to understand?', ph: 'e.g. The fear of being left out' }
];
const STORE_KEY = 'csm2-katha-html-v1';

/* ---------- tiny html helpers ---------- */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (c, html) => (c ? (typeof html === 'function' ? html() : html) : '');
const each = (arr, fn) => (arr || []).map(fn).join('');
const pressed = (b) => `aria-pressed="${b ? 'true' : 'false'}"`;
const dis = (b) => (b ? 'disabled' : '');
const ICON = {

  up: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  left: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',

  info: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="flex:0 0 auto"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
  image: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-5-8 7"/></svg>',

  wifiOff: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFD93B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5.5 12a10 10 0 0 1 13 0"/><path d="M9 15.5a5 5 0 0 1 6 0"/><path d="M3 3l18 18"/></svg>',

};
const maleIcon = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#E6EEFF" stroke="#141414" stroke-width="3"/><path d="M11 60c2-11 10-16 21-16s19 5 21 16z" fill="#1F4FB8" stroke="#141414" stroke-width="3"/><circle cx="32" cy="27" r="11" fill="#F2CFAE" stroke="#141414" stroke-width="3"/><path d="M21 26c0-8 5-12 11-12s11 4 11 12c-3-4-7-5-11-5s-8 1-11 5z" fill="#141414"/></svg>`;
const femaleIcon = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#FFE7E3" stroke="#141414" stroke-width="3"/><path d="M11 60c2-11 10-16 21-16s19 5 21 16z" fill="#FF4A3D" stroke="#141414" stroke-width="3"/><circle cx="32" cy="12" r="5.5" fill="#141414"/><circle cx="32" cy="27" r="11" fill="#F2CFAE" stroke="#141414" stroke-width="3"/><path d="M21 26c0-8 5-12 11-12s11 4 11 12c-3-4-7-5-11-5s-8 1-11 5z" fill="#141414"/><path d="M20 27c-1 6 0 12 3 16" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="24" r="1.7" fill="#FF4A3D"/></svg>`;
function charIcon(c, s) {
  const human = c.form === 'Human' || c.form === 'Divine being';
  const fem = c.gender === 'female';
  const col = esc(c.color);
  let inner = '';
  if (c.form === 'Divine being') inner += '<circle cx="32" cy="26" r="17" fill="none" stroke="#FFD93B" stroke-width="4"/>';
  if (human) {
    inner += `<path d="M11 60c2-11 10-16 21-16s19 5 21 16z" fill="${col}" stroke="#141414" stroke-width="3"/>`;
    if (fem) inner += '<circle cx="32" cy="12" r="5.5" fill="#141414"/>';
    inner += '<circle cx="32" cy="27" r="11" fill="#F2CFAE" stroke="#141414" stroke-width="3"/><path d="M21 26c0-8 5-12 11-12s11 4 11 12c-3-4-7-5-11-5s-8 1-11 5z" fill="#141414"/>';
    if (fem) inner += '<path d="M20 27c-1 6 0 12 3 16" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="24" r="1.7" fill="#FF4A3D"/>';
  } else if (c.form === 'Bird') {
    inner += `<path d="M28 18l4-9 4 9" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="33" r="15" fill="${col}" stroke="#141414" stroke-width="3"/><path d="M43 30l13 4-13 4z" fill="#FFD93B" stroke="#141414" stroke-width="2.5" stroke-linejoin="round"/><circle cx="34" cy="30" r="2.4" fill="#141414"/>`;
  } else {
    inner += `<path d="M17 24l4-12 9 8z M47 24l-4-12-9 8z" fill="${col}" stroke="#141414" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="34" r="16" fill="${col}" stroke="#141414" stroke-width="3"/><ellipse cx="32" cy="41" rx="7" ry="5" fill="#F2CFAE" stroke="#141414" stroke-width="2.5"/><circle cx="26" cy="31" r="2.2" fill="#141414"/><circle cx="38" cy="31" r="2.2" fill="#141414"/>`;

/* ---------- mock art (real S3 urls render as <img>) ---------- */
function figSvg(f, a, simple) {
  if (!f || !f.op) return '';

  if (f.pet) {
    return `<g transform="${f.t}"><path d="M-28 -24 Q-46 -34 -40 -48" fill="none" stroke="${f.color}" stroke-width="7" stroke-linecap="round"/><ellipse cy="-18" rx="30" ry="17" fill="${f.color}" ${st}/><path d="M16 -50 L20 -66 L30 -52 Z" fill="${f.color}" ${st}/><circle cx="26" cy="-40" r="15" fill="${f.color}" ${st}/><circle cx="30" cy="-42" r="2.6" fill="#141414"/></g>`;
  }
  return `<g transform="${f.t}">${f.cape ? `<path d="M-18 -52 L-46 -4 L-12 -14 Z" fill="#FF4A3D" ${st}/>` : ''}<path d="M-22 0 Q-24 -58 0 -60 Q24 -58 22 0 Z" fill="${f.color}" fill-opacity="${a.fo}" ${st}/>${f.bun ? '<circle cy="-100" r="9" fill="#141414"/>' : ''}<circle cy="-80" r="21" fill="#F2CFAE" ${st}/><circle cx="-7" cy="-82" r="2.8" fill="#141414"/><circle cx="7" cy="-82" r="2.8" fill="#141414"/><path d="M-7 -72 Q0 -66 7 -72" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round"/></g>`;
}
function sceneSvg(a, label) {
  const st = `stroke="${a.ink}" stroke-width="${a.sw}" stroke-dasharray="${a.dash}" stroke-linejoin="round"`;
  return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}><rect width="400" height="300" fill="${a.sky}"/><circle cx="${a.sunX}" cy="70" r="34" fill="${a.sun}" ${st}/>${a.cloudOp ? `<path d="${a.cloud}" fill="#FFFFFF" ${st}/>` : ''}<path d="${a.hill2}" fill="${a.hillB}" fill-opacity="${a.fo}" ${st}/><path d="${a.hill}" fill="${a.hillA}" fill-opacity="${a.fo}" ${st}/>${figSvg(a.f1, a)}${figSvg(a.f2, a)}${figSvg(a.f3, a)}</svg>`;

/* ---------- page panel (one component for thumbs, editor, reader, print) ---------- */
function pagePanel(pg, title, starring, pageNo) {
  pg = pg || { kind: 'middle', status: 'none' };
  const kind = pg.kind || 'middle', layout = pg.layout || 'caption', status = pg.status || 'none';
  const done = status === 'done', isMid = kind === 'middle', isGrid = isMid && layout === 'grid';
  const url = pg.imageUrl || '';
  const real = done && url && url.indexOf('mock://') !== 0;
  const bg = kind === 'cover' ? '#1F4FB8' : kind === 'end' ? '#FF4A3D' : '#FFFDF8';
  const dots = isMid ? 'none' : 'radial-gradient(rgba(20,20,20,.28) 1.2px, transparent 1.8px)';
  const overlay = () => {
    if (status === 'queued') return '<div class="pp-over" style="background-color:#F3EEE4;background-image:radial-gradient(rgba(20,20,20,.18) 1.2px,transparent 1.7px);background-size:3.4cqw 3.4cqw">Waiting its turn</div>';
    if (status === 'drawing') return '<div class="pp-over" style="background:repeating-linear-gradient(45deg,#FFD93B 0 3cqw,#FFF3B8 3cqw 6cqw)"><span style="background:#fff;border:max(2px,.9cqw) solid #141414;padding:1.5cqw 3.5cqw">Drawing…</span></div>';
    if (status === 'failed') return '<div class="pp-over" style="flex-direction:column;gap:2cqw;background:repeating-linear-gradient(-45deg,#FFE1DC 0 3cqw,#fff 3cqw 6cqw)"><span>Couldn\'t draw this page</span><span style="font-family:\'Comic Neue\',sans-serif;font-weight:700;font-size:3.8cqw;letter-spacing:0">Edit the prompt and redraw</span></div>';
    if (status === 'none') return '<div class="pp-over" style="background:#FFFDF8;font-family:\'Comic Neue\',sans-serif;font-weight:700;font-size:4.2cqw;letter-spacing:0;color:#4A4A4A">Picture not drawn yet</div>';
    return '';
  };
  const pendingBg = status === 'drawing' ? 'repeating-linear-gradient(45deg,#FFD93B 0 3cqw,#FFF3B8 3cqw 6cqw)' : status === 'failed' ? 'repeating-linear-gradient(-45deg,#FFE1DC 0 3cqw,#fff 3cqw 6cqw)' : 'radial-gradient(rgba(20,20,20,.18) 1.2px,#F3EEE4 1.7px)';
  let body = '';
  if (kind === 'cover') body += `<h2 class="pp-title">${esc(title || pg.caption)}</h2>`;
  if (isGrid) {
    body += `<div class="pp-grid">${each((pg.panels || []).slice(0, 6), (pn, k) => {
      const pu = pn.imageUrl || '';
      const pReal = done && pu && pu.indexOf('mock://') !== 0;
      return `<div class="pp-cell">${done ? (pReal ? `<img src="${esc(pu)}" alt="">` : (pn.art ? sceneSvg(pn.art) : '')) : `<div style="position:absolute;inset:0;background:${pendingBg};background-size:3.4cqw 3.4cqw"></div>`}${pn.bubble && pn.bubble.trim() ? `<div class="pp-cbub" style="${k % 2 ? 'right' : 'left'}:1.4cqw">${esc(pn.bubble)}</div>` : ''}</div>`;
    })}</div>`;
    if (!done) body += `<p style="margin:0;align-self:center;font-family:'Bangers',Impact,sans-serif;font-size:5cqw;letter-spacing:.04em;background:#fff;border:max(2px,.9cqw) solid #141414;padding:.8cqw 3cqw">${status === 'drawing' ? 'Drawing 6 panels…' : status === 'queued' ? 'Waiting its turn' : status === 'failed' ? "Couldn't draw this page" : 'Not drawn yet'}</p>`;
  } else {
    const art = done ? (real ? `<img src="${esc(url)}" alt="${esc(pg.caption)}">` : (pg.art ? sceneSvg(pg.art, pg.caption || 'Story illustration') : '')) : overlay();
    const bubble = done && isMid && pg.bubble && pg.bubble.trim() ? `<div class="pp-bubble">${esc(pg.bubble)}</div>` : '';
    const capOver = isMid && layout === 'full' ? `<p class="pp-cap" style="position:absolute;left:3cqw;right:3cqw;bottom:3cqw">${esc(pg.caption)}</p>` : '';
    body += `<div style="flex:1 1 auto;min-height:0;display:flex;gap:3cqw"><div class="pp-art">${art}${bubble}${capOver}</div></div>`;
  }
  if (isMid && layout !== 'full') body += `<p class="pp-cap">${esc(pg.caption)}</p>`;
  if (kind === 'cover') body += `<p style="margin:0;align-self:center;background:#fff;border:max(2px,.9cqw) solid #141414;padding:1.6cqw 4cqw;font-weight:700;font-size:3.8cqw;text-align:center;box-shadow:1cqw 1cqw 0 #141414">${esc(starring)}</p>`;
  if (kind === 'end') body += `<div style="display:flex;flex-direction:column;align-items:center;gap:1.5cqw"><p style="margin:0;font-weight:700;font-size:4.2cqw;line-height:1.3;text-align:center;background:#fff;border:max(2px,.9cqw) solid #141414;padding:2cqw 3cqw;text-wrap:pretty">${esc(pg.caption)}</p><p class="pp-end">The End</p></div>`;
  if (isMid && pageNo) body += `<span class="pp-no" aria-hidden="true">${esc(pageNo)}</span>`;
  return `<div class="pp" style="background-color:${bg};background-image:${dots}">${body}</div>`;
}

/* =====================================================================
   App
   ===================================================================== */
class App {
  constructor(root) {

  /* ---------- state + render ---------- */
  setState(upd, cb) {

    this.root.addEventListener('change', (e) => { if (e.target.hasAttribute('data-change')) call('data-change', e); });

  }

    try { if (focusId && a.selectionStart != null) { selS = a.selectionStart; selE = a.selectionEnd; } } catch (e) {}
    this._h = [];
    this.root.innerHTML = this.view();
    document.getElementById('page-size').textContent = this.state.paper === 'a4' ? '@page{size:A4;margin:10mm}' : '@page{size:letter;margin:0.4in}';

      const el = document.getElementById(focusId);

  }

  later(fn, ms) { const t = setTimeout(() => { this._timers.delete(t); fn(); }, ms); this._timers.add(t); return t; }
  uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }
  hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  rng(seed) { let a = this.hash(String(seed)); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  ago(ts) { const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return 'Edited just now'; if (m < 60) return 'Edited ' + m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return 'Edited ' + h + ' h ago'; return 'Edited ' + Math.round(h / 24) + ' d ago'; }

  clean(s) { return (s || '').trim().replace(/[.!]+$/, ''); }
  joinNames(arr) { return arr.join(', ').replace(/, ([^,]*)$/, ' & $1'); }

  /* =================================================================
     api module: the ONLY place that talks to a backend
     ================================================================= */
  createApi() {
    if (!CONFIG.MOCK) {
      const off = () => Promise.reject({ code: 'NO_BACKEND', message: 'The real backend is not wired into this prototype.' });
      return new Proxy({}, { get: () => off });
    }
    const self = this;
    const wait = (ms) => new Promise((resolve, reject) => { self.later(() => { if (self.state.dev.offline) reject({ code: 'OFFLINE', message: "You're offline." }); else resolve(); }, ms); });
    const dur = (ms) => (self.state.dev.realistic ? ms * 2.2 : ms);
    const job = (ms, produce) => { const id = self.uid('job'); self._jobs[id] = { created: Date.now(), ms, produce, final: null }; return { jobId: id }; };
    return {
      // GET /stories
      listStories: async () => { const mode = self.state.dev.library; await wait(mode === 'slow' ? 2800 : 450); if (mode === 'error') throw { code: 'SERVER', message: 'Library failed to load.' }; if (mode === 'empty') return []; return self.state.stories.map((s) => ({ id: s.id, title: s.title })); },
      // POST /stories -> { jobId }
      createStory: async (body) => { await wait(350); return job(self.state.dev.realistic ? 45000 : 9000, () => { if (self.state.dev.storyFail) throw { code: 'STORY_TIMEOUT', message: 'The story writer took too long to answer.' }; return self.mockStory(body); }); },
      // PATCH /stories/{id}, DELETE /stories/{id}
      patchStory: async () => { await wait(350); return { ok: true }; },
      deleteStory: async () => { await wait(400); return { ok: true }; },
      // POST /characters/{id}/sheet -> { jobId }; result { imageUrl, fallbackNote }
      createSheet: async () => { await wait(250); return job(dur(4200 + Math.random() * 1800), () => { const o = self.mockOutcome('sheet'); return { imageUrl: 'mock://sheet/' + self.uid('s'), fallbackNote: o.note }; }); },
      // POST /stories/{id}/pages/{n}/image -> { jobId }; result { imageUrl, versionId, fallbackNote, panelImages? }
      drawPage: async (storyId, n, body) => { await wait(250); return job(dur(3200 + Math.random() * 3200), () => { const o = self.mockOutcome('page'); return { imageUrl: 'mock://page/' + self.uid('p'), panelImages: body.panels ? body.panels.map(() => 'mock://panel/' + self.uid('q')) : undefined, versionId: self.uid('v'), fallbackNote: o.note }; }); },
      // PROPOSED: POST /stories/{id}/pages/{n}/rewrite
      rewritePage: async (storyId, n, body) => { await wait(250); return job(dur(2600), () => self.mockRewrite(body)); },
      // GET /jobs/{jobId}
      getJob: async (jobId) => { await wait(120); const j = self._jobs[jobId]; if (!j) throw { code: 'NOT_FOUND', message: 'Job not found.' }; const t = Date.now() - j.created; if (t < 500) return { status: 'queued' }; if (t < j.ms) return { status: 'running' }; if (!j.final) { try { j.final = { status: 'done', result: j.produce() }; } catch (err) { j.final = { status: 'failed', error: err }; } } return j.final; },
      // POST /uploads -> presigned PUT
      createUpload: async (body) => { await wait(300); const key = self.uid('u'); return { uploadUrl: 'mock://s3-put/' + key, fileUrl: 'mock://uploads/' + key + '/' + body.filename }; },
      putFile: async () => { await wait(1100); return { ok: true }; },
      // POST /stories/{id}/share
      shareStory: async () => { await wait(800); return { shareUrl: 'https://[YOUR_DOMAIN]/s/' + self.uid('b').slice(2) }; },
      // PROPOSED: DELETE /me/images
      deletePhotos: async () => { await wait(700); return { ok: true }; }
    };
  }
  pollJob(jobId, isCancelled) {
    return new Promise((resolve, reject) => {
      const tick = () => {
        if (isCancelled && isCancelled()) return reject({ code: 'CANCELLED' });
        this.api.getJob(jobId).then((j) => {
          if (isCancelled && isCancelled()) return reject({ code: 'CANCELLED' });
          if (j.status === 'done') resolve(j.result);
          else if (j.status === 'failed') reject(j.error || { code: 'FAILED', message: 'Job failed.' });
          else this.later(tick, 800);
        }, (err) => { if (err && err.code === 'OFFLINE') this.later(tick, 2000); else reject(err); });

    });
  }
  mockOutcome(kind) {
    const mode = this.state.dev.failMode;
    const fail = (code) => { throw { code, message: 'Declined at every step (with photo, without photo, text only).' }; };
    if (mode === 'all') fail('IMAGE_SAFETY');
    if (mode === 'none') return { note: '' };
    const r = Math.random();
    const noPhoto = kind === 'sheet' ? 'The reference photo was declined, so this sheet was drawn from your description instead. It may look less like them.' : 'The first try was declined, so this was redrawn without the reference images. Faces may differ slightly from the sheet.';
    const textOnly = 'Reference images were declined, so this was drawn from the text only. Check that everyone still looks right.';

  }

  /* ---------- mock story writer ---------- */
  cast(chars) {
    const named = chars.filter((c) => c.name);
    const find = (r) => named.find((c) => c.role === r);
    const nayak = find('nayak') || named[0] || { id: '', name: 'Our hero', role: 'nayak', purushartha: {} };
    const rival = find('pratinayak'), guru = find('guru');
    const helper = find('sahayak') || find('mitra') || find('parivaar') || named.find((c) => c !== nayak && c !== rival && c !== guru);
    return { nayak, rival, guru, helper, H: nayak.name, R: rival ? rival.name : 'the trouble', G: guru ? guru.name : 'a wise old sage', S: helper ? helper.name : (guru ? guru.name : 'a new friend') };
  }
  kaalPhrase(k) {

  }
  chooseFormat(setup, chars) {
    if (setup.format === 'single') return { layout: 'caption', reason: 'Single scene on every page: one picture with a short caption below.' };
    if (setup.format === 'grid') return { layout: 'grid', reason: '3×2 comic grid: six panels per page, each with its own speech bubble.' };
    const keys = chars.filter((c) => c.isKey && c.name).length;
    const subs = (setup.desh.subs || []).filter(Boolean).length;
    const len = (setup.katha || '').length + (setup.paristhiti || '').length;
    const score = keys + subs + (len > 420 ? 2 : len > 200 ? 1 : 0) + (setup.age === '7–10' ? 1 : 0);
    if (score >= 5) return { layout: 'grid', reason: 'Auto picked a 3×2 comic grid: ' + keys + ' key characters, ' + subs + ' sublocations and a detailed plot need room for dialogue.' };
    return { layout: 'caption', reason: 'Auto picked a single scene per page: the story is simple enough for one picture and a short caption.' + (score >= 3 ? ' Add more detail or characters and it will switch to a 3×2 grid.' : '') };
  }
  styleWord(style) { return { Comic: 'Bold comic-book', Watercolour: 'Soft watercolour', Crayon: 'Hand-drawn crayon', 'Madhubani-inspired': 'Madhubani-inspired folk-art' }[style] || 'Bold comic-book'; }
  panelsFor(beat, ctx) {
    const A = beat.A || ctx.c.nayak; const B = beat.B || ctx.c.helper || ctx.c.guru || ctx.c.rival || A;
    const sw = this.styleWord(ctx.setup.style);
    const p = (shot) => sw + ' comic panel. ' + shot + ', ' + beat.loc + ', ' + ctx.when + '. No text or speech bubbles.';
    const L = beat.lines || ['', '', '', ''];
    return [
      { id: this.uid('pn'), prompt: p('Wide establishing shot'), bubble: '', speakerId: '' },
      { id: this.uid('pn'), prompt: p('Close-up of ' + A.name + ', speaking'), bubble: L[0], speakerId: L[0] ? A.id : '' },
      { id: this.uid('pn'), prompt: p(B.name + ' replying'), bubble: L[1], speakerId: L[1] ? B.id : '' },
      { id: this.uid('pn'), prompt: p(A.name + ' and ' + B.name + ' together'), bubble: L[2], speakerId: L[2] ? A.id : '' },
      { id: this.uid('pn'), prompt: p('Detail: ' + (beat.detail || 'an important object in the scene')), bubble: '', speakerId: '' },
      { id: this.uid('pn'), prompt: p(A.name + ' making a decision'), bubble: L[3], speakerId: L[3] ? B.id : '' }

  mockStory(body) {
    const s = body.setup, chars = body.characters || [];
    const c = this.cast(chars);
    const { H, R, G, S } = c;
    const place = this.clean(s.desh.main) || 'a faraway land';
    const subs = (s.desh.subs || []).map((x) => this.clean(x)).filter(Boolean);
    const sub = (i) => (subs.length ? subs[i % subs.length] : place);
    const when = this.kaalPhrase(s.kaal);
    const pa = c.nayak.purushartha || {};
    const drives = Object.keys(pa).filter((k) => pa[k] && pa[k].on);
    const primary = drives[0] || 'Dharma';
    const note = pa[primary] && pa[primary].note ? this.lowerFirst(this.clean(pa[primary].note)) : '';
    const want = {
      Dharma: H + ' knew that doing the right thing mattered more than doing the easy thing' + (note ? ': ' + note : '') + '.',
      Artha: H + ' wanted to use what little there was wisely' + (note ? ': ' + note : ', so nobody went hungry') + '.',
      Kaam: H + ' carried a wish, bright as a diya' + (note ? ': ' + note : '') + '.',

    const par = this.clean(s.paristhiti);
    const kat = this.clean((s.katha || '').split(/\.\s+/)[0]);
    const lesson = this.clean(s.lesson) || 'A calm mind and a kind heart always find the way';
    const pool = [
      { c: 'Once upon a time, ' + when + ', in ' + this.lowerFirst(place) + ', there lived ' + H + '.', scene: H + ' in ' + place, loc: sub(0), A: c.nayak, B: c.helper, lines: ['What a beautiful morning!', 'Every morning is beautiful with friends, ' + H + '.', 'Come, let us go to the ' + sub(0) + '.', 'Race you there!'], detail: 'the ' + sub(0) },
      { c: want, scene: H + ' thinking deeply', loc: sub(1), A: c.nayak, B: c.guru || c.helper, lines: ['What should I do?', 'Listen to your heart, and to dharma.', 'But it is not easy…', 'The right path rarely is.'], detail: 'a small diya flickering' },
      { c: par ? 'But trouble was brewing: ' + this.lowerFirst(par) + '.' : 'But one day, everything changed.', scene: 'the trouble arrives', loc: sub(2), A: c.rival || c.helper, B: c.nayak, lines: ['Things are not the same anymore!', 'What happened here?', 'You will have to choose, ' + H + '.', 'Then I will choose wisely.'], detail: 'signs of the trouble' },
      { c: kat ? H + ' had a choice to make. ' + kat + '.' : H + ' had a choice to make.', scene: H + ' facing the choice', loc: sub(0), A: c.nayak, B: c.helper, lines: ['I made a promise.', 'Promises can be heavy.', 'Then I will carry it.', 'And I will help you.'], detail: 'two paths splitting' },

  /* ---------- persistence (no lost edits) ---------- */

      pages: (s.pages || []).map((p) => Object.assign({}, p, { status: p.status === 'drawing' ? 'queued' : p.status, rewriting: false })),
      characters: (s.characters || []).map((c) => Object.assign({}, c, { refs: fixRefs(c.refs), sheet: Object.assign({}, c.sheet, { status: c.sheet.status === 'drawing' ? (c.sheet.versions.length ? 'review' : 'none') : c.sheet.status }) }))

        .then(() => { this._unsynced.delete(id); this.setState({ saveState: this._unsynced.size ? 'local' : 'saved' }); })

    this.later(() => this.dismissToast(id), action ? 7000 : 4200);

    if (['desh', 'kaal', 'paatra', 'paristhiti', 'katha', 'outline'].indexOf(screen) >= 0) return this.go(screen, { user, storyId: draft && draft.id });

    if (screen === 'editor') return this.go('editor', { user, storyId: done && done.id, editorIndex: 2 });
    if (screen === 'shared') return this.go('shared', { user, storyId: done && done.id, readerIndex: 0 });

  /* ---------- reference images (multi-upload, presigned S3) ---------- */
  updateRefs(stId, target, fn) {
    if (target.type === 'place') this.updateStory(stId, (x) => Object.assign({}, x, { setup: Object.assign({}, x.setup, { refs: fn(x.setup.refs || []) }) }), { noSync: true });
    else this.updateChar(stId, target.id, (c) => ({ refs: fn(c.refs || []) }), { noSync: true });
  }
  onRefFiles(target, e) {

      if (file.size > 10 * 1048576) { this.toast(file.name + ' is over 10 MB. Try a smaller one.', 'warn'); return; }
      const id = this.uid('r');
      this.updateRefs(st.id, target, (rs) => rs.concat([{ id, name: file.name, size: file.size, status: 'uploading' }]));
      this.api.createUpload({ filename: file.name, contentType: file.type || 'image/jpeg', purpose: target.type === 'place' ? 'place-reference' : 'character-reference', characterId: target.id })
        .then((u) => this.api.putFile(u.uploadUrl, file).then(() => u))
        .then((u) => this.updateRefs(st.id, target, (rs) => rs.map((r) => (r.id === id ? Object.assign({}, r, { status: 'uploaded', fileUrl: u.fileUrl }) : r))))
        .catch((err) => { this.updateRefs(st.id, target, (rs) => rs.filter((r) => r.id !== id)); this.toast(err.code === 'OFFLINE' ? "You're offline, so " + file.name + " wasn't uploaded." : 'Upload failed for ' + file.name + '.', 'warn'); });
    });
    if (files.length > 8) this.toast('Up to 8 images at a time.', 'warn');
  }
  removeRef(target, r) { this.updateRefs(this.cur().id, target, (rs) => rs.filter((x) => x.id !== r.id)); this.toast(r.name + ' deleted.'); }
  askDeletePhotos() {
    this.setState({ menuOpen: false, confirm: { title: 'Delete all your images?', body: 'Every reference image you uploaded, in every storybook, will be deleted from our servers. Approved cartoon sheets and drawn pages stay.', yes: 'Delete images', run: () => {
      this.api.deletePhotos().then(() => {
        this.setState((s) => ({ stories: s.stories.map((st) => Object.assign({}, st, { setup: Object.assign({}, st.setup, { refs: [] }), characters: st.characters.map((c) => Object.assign({}, c, { refs: [] })) })) }), () => this.persist());
        this.toast('All reference images deleted.');
      }, () => this.toast("Couldn't delete images right now. Try again when you're online.", 'warn'));
    } } });
  }

  /* ---------- paatra ---------- */
  addChar(role) { const st = this.cur(); this.updateStory(st.id, (x) => Object.assign({}, x, { characters: x.characters.concat([this.newChar(role, x.characters.length)]) })); }
  removeChar(c) {
    const st = this.cur();
    const idx = st.characters.findIndex((x) => x.id === c.id);
    this.updateStory(st.id, (x) => Object.assign({}, x, { characters: x.characters.filter((y) => y.id !== c.id) }));
    this.toast((c.name || 'Character') + ' removed.', 'info', { label: 'Undo', run: () => this.updateStory(st.id, (x) => { const cs = x.characters.slice(); cs.splice(idx, 0, c); return Object.assign({}, x, { characters: cs }); }) });
  }
  drawSheet(c) {
    const st = this.cur();
    if (!c.name.trim() && !c.appearance.trim()) return this.toast('Add a name or a short description first.', 'warn');
    this.updateChar(st.id, c.id, (x) => ({ sheet: Object.assign({}, x.sheet, { status: 'drawing', error: '' }) }), { noSync: true });
    this.api.createSheet(c.id, { name: c.name, gender: c.gender, form: c.form, role: c.role, age: c.age, appearance: c.appearance, style: st.setup.style, referenceUrls: (c.refs || []).filter((r) => r.fileUrl).map((r) => r.fileUrl) })
      .then((r) => this.pollJob(r.jobId))
      .then((res) => this.updateChar(st.id, c.id, (x) => { const vs = x.sheet.versions.concat([{ imageUrl: res.imageUrl, note: res.fallbackNote || '' }]); return { sheet: { status: 'review', versions: vs, active: vs.length - 1, error: '' } }; }))
      .catch((err) => {
        const msg = err.code === 'OFFLINE' ? "You're offline. Try again when you're back." : 'The image service declined it with the reference images, without them, and from text only. Try a simpler description, or remove the images.';
        this.updateChar(st.id, c.id, (x) => ({ sheet: Object.assign({}, x.sheet, { status: x.sheet.versions.length ? 'review' : 'failed', error: msg }) }), { noSync: true });
        if (c.sheet.versions.length) this.toast('The new sheet failed. Your earlier one is kept.', 'warn');
      });
  }
  approveSheet(c) { this.updateChar(this.cur().id, c.id, (x) => ({ sheet: Object.assign({}, x.sheet, { status: 'approved' }) })); this.toast((c.name || 'Character') + "'s sheet approved. It'll guide every page."); }
  togglePa(c, k) { this.updateChar(this.cur().id, c.id, (x) => { const p = Object.assign({}, x.purushartha); p[k] = Object.assign({}, p[k], { on: !(p[k] && p[k].on) }); return { purushartha: p }; }); }
  paNote(c, k, v) { this.updateChar(this.cur().id, c.id, (x) => { const p = Object.assign({}, x.purushartha); p[k] = Object.assign({}, p[k], { note: v }); return { purushartha: p }; }); }

  /* ---------- writing ---------- */
  missing(st) {
    const m = [];
    if (!this.clean(st.setup.desh.main)) m.push('the main place (Desh)');
    if (!st.characters.some((c) => c.role === 'nayak' && c.name.trim())) m.push('a named nayak (Paatra)');
    if (!this.clean(st.setup.katha)) m.push('the main plot (Katha)');
    return m;
  }
  writeStory(force) {
    const st = this.cur();
    if (!st) return;
    if (this.missing(st).length) { this.go('katha'); this.setState({ kathaError: !this.clean(st.setup.katha) }); return; }
    if (st.pages.length && !force) { this.setState({ confirm: { title: 'Write a brand-new draft?', body: 'Your current outline and any edits will be replaced. Pictures already drawn stay in their page history until you redraw.', yes: 'Write new draft', run: () => this.writeStory(true) } }); return; }
    const token = this.uid('w');
    this._writeToken = token;
    this.setState({ screen: 'writing', writing: { startedAt: Date.now(), elapsed: 0, error: null, token } });
    clearInterval(this._writeTick);
    this._writeTick = setInterval(() => { this.setState((s) => (s.writing && s.writing.token === token && !s.writing.error ? { writing: Object.assign({}, s.writing, { elapsed: Date.now() - s.writing.startedAt }) } : null)); }, 500);
    const cancelled = () => this._writeToken !== token;
    const body = {
      storyId: st.id, setup: st.setup,
      characters: st.characters.map((c) => ({ id: c.id, name: c.name, gender: c.gender, form: c.form, role: c.role, isKey: c.isKey, age: c.age, appearance: c.appearance, purushartha: c.purushartha, color: c.color, sheetUrl: c.sheet.versions[c.sheet.active] ? c.sheet.versions[c.sheet.active].imageUrl : null })),
      referenceUrls: (st.setup.refs || []).filter((r) => r.fileUrl).map((r) => r.fileUrl)
    };
    this.api.createStory(body)
      .then((r) => this.pollJob(r.jobId, cancelled))
      .then((res) => {
        clearInterval(this._writeTick);
        if (cancelled()) return;
        this.updateStory(st.id, (x) => Object.assign({}, x, { title: res.title, status: 'outline', pages: res.pages.map((p, i) => this.pageFromJob(p, i, res.pages.length)) }));
        this.go('outline', { writing: null });
        this.toast('Your katha is ready to review.');
      })
      .catch((err) => {
        clearInterval(this._writeTick);
        if (err.code === 'CANCELLED') return;
        const msg = err.code === 'OFFLINE' ? "You're offline, so the story couldn't start." : err.code === 'STORY_TIMEOUT' ? 'The story writer took too long to answer.' : this.errMsg(err);
        this.setState((s) => ({ writing: Object.assign({}, s.writing, { error: msg }) }));
      });
  }
  cancelWriting() { this._writeToken = null; clearInterval(this._writeTick); this.go('katha', { writing: null }); this.toast('Story writing cancelled. Everything you set up is kept.'); }

  /* ---------- outline ---------- */
  movePage(id, dir) { const st = this.cur(); this.updateStory(st.id, (x) => { const ps = x.pages.slice(); const i = ps.findIndex((p) => p.id === id); const j = i + dir; if (j < 1 || j > ps.length - 2) return x; const t = ps[i]; ps[i] = ps[j]; ps[j] = t; return Object.assign({}, x, { pages: ps }); }); }
  deletePage(id) {
    const st = this.cur(); const i = st.pages.findIndex((p) => p.id === id); const pg = st.pages[i];
    this.updateStory(st.id, (x) => Object.assign({}, x, { pages: x.pages.filter((p) => p.id !== id) }));
    this.toast('Page deleted.', 'info', { label: 'Undo', run: () => this.updateStory(st.id, (x) => { const ps = x.pages.slice(); ps.splice(i, 0, pg); return Object.assign({}, x, { pages: ps }); }) });
  }
  blankPanels(st, page) { const c = this.cast(st.characters); return this.panelsFor({ loc: page.location || st.setup.desh.main || 'the scene', A: c.nayak, B: c.helper, lines: ['', '', '', ''], detail: 'an important object' }, { setup: st.setup, c, when: this.kaalPhrase(st.setup.kaal) }); }
  addPageAfter(id) {
    const st = this.cur(); const i = st.pages.findIndex((p) => p.id === id);
    const fmt = this.chooseFormat(st.setup, st.characters);
    const fresh = this.pageFromJob({ caption: '', imagePrompt: '', layout: fmt.layout, location: st.setup.desh.subs[0] || st.setup.desh.main }, 1, 3);
    if (fmt.layout === 'grid') fresh.panels = this.blankPanels(st, fresh);
    this.updateStory(st.id, (x) => { const ps = x.pages.slice(); ps.splice(i + 1, 0, fresh); return Object.assign({}, x, { pages: ps }); });
  }
  setLayout(page, layout) { const st = this.cur(); this.updatePage(st.id, page.id, (p) => ({ layout, panels: layout === 'grid' && !(p.panels && p.panels.length) ? this.blankPanels(st, p) : p.panels })); }
  rewritePage(pg) {
    const st = this.cur(); const n = st.pages.findIndex((p) => p.id === pg.id);
    this.updatePage(st.id, pg.id, { rewriting: true }, { noSync: true });
    this.api.rewritePage(st.id, n, { caption: pg.caption, imagePrompt: pg.imagePrompt, panels: pg.panels })
      .then((r) => this.pollJob(r.jobId))
      .then((res) => this.updatePage(st.id, pg.id, { caption: pg.kind === 'cover' ? pg.caption : res.caption, imagePrompt: res.imagePrompt, panels: res.panels && res.panels.length ? res.panels : pg.panels, rewriting: false }))
      .catch((err) => { this.updatePage(st.id, pg.id, { rewriting: false }, { noSync: true }); this.toast(err.code === 'OFFLINE' ? "You're offline. Rewrite needs a connection." : "Couldn't rewrite that page. Try again.", 'warn'); });
  }

  /* ---------- illustrate (cover first, then 3 at a time) ---------- */
  startIllustrating() { const st = this.cur(); this.updateStory(st.id, (x) => Object.assign({}, x, { status: 'illustrating', pages: x.pages.map((p) => (p.status === 'done' ? p : Object.assign({}, p, { status: 'queued', error: null }))) }), { then: () => this.go('illustrate') }); }
  retryFailed() { const st = this.cur(); this.updateStory(st.id, (x) => Object.assign({}, x, { status: 'illustrating', pages: x.pages.map((p) => (p.status === 'failed' ? Object.assign({}, p, { status: 'queued', error: null }) : p)) }), { then: () => this.pump(st.id) }); }
  pump(storyId) {
    const st = this.storyById(storyId);
    if (!st || this.state.dev.offline) return;
    const ps = st.pages;
    const drawing = ps.filter((p) => p.status === 'drawing').length;
    const cover = ps[0];
    if (cover && cover.status === 'queued') { if (drawing === 0) this.drawPage(storyId, cover.id); return; }
    if (cover && cover.status === 'drawing') return;
    ps.filter((p) => p.status === 'queued').slice(0, Math.max(0, 3 - drawing)).forEach((p) => this.drawPage(storyId, p.id));
    const busy = ps.some((p) => p.status === 'queued' || p.status === 'drawing');
    if (!busy && st.status === 'illustrating') {
      const failed = ps.filter((p) => p.status === 'failed').length;
      if (!failed) { this.updateStory(storyId, (x) => Object.assign({}, x, { status: 'done' })); this.toast('All pictures are drawn. Your book is ready!', 'info', { label: 'Read it', run: () => this.go('reader', { storyId, readerIndex: 0 }) }); }
      else this.toast(failed + (failed === 1 ? ' page needs' : ' pages need') + ' a new prompt.', 'warn');
    }
  }
  drawPage(storyId, pageId) {
    const st = this.storyById(storyId);
    const n = st.pages.findIndex((p) => p.id === pageId);
    const pg = st.pages[n];
    if (this.state.dev.offline) { this.toast("You're offline. Drawing will resume when you're back.", 'warn'); return; }
    // mark drawing synchronously so pump() doesn't double-start this page
    this.state = Object.assign({}, this.state, { stories: this.state.stories.map((x) => (x.id === storyId ? Object.assign({}, x, { pages: x.pages.map((p) => (p.id === pageId ? Object.assign({}, p, { status: 'drawing', error: null }) : p)) }) : x)) });
    this.setState(null);
    const isGrid = pg.kind === 'middle' && pg.layout === 'grid';
    this.api.drawPage(storyId, n, { prompt: pg.imagePrompt, layout: isGrid ? 'grid' : 'single', panels: isGrid ? pg.panels.map((x) => ({ prompt: x.prompt, speakerId: x.speakerId })) : undefined })
      .then((r) => this.pollJob(r.jobId))
      .then((res) => this.updatePage(storyId, pageId, (p) => ({ status: 'done', versions: p.versions.concat([{ id: res.versionId, imageUrl: res.imageUrl, panelImages: res.panelImages || [], note: res.fallbackNote || '', at: Date.now() }]), activeVersionId: res.versionId, error: null }), { then: () => this.pump(storyId) }))
      .catch((err) => { const off = err.code === 'OFFLINE'; this.updatePage(storyId, pageId, { status: off ? 'queued' : 'failed', error: off ? null : { code: err.code || 'ERROR', message: this.errMsg(err) } }, { noSync: true, then: () => this.pump(storyId) }); });
  }
  redrawCurrent() {
    const st = this.cur(); const pg = st.pages[this.state.editorIndex];
    if (!pg || pg.status === 'drawing') return;
    const isGrid = pg.kind === 'middle' && pg.layout === 'grid';
    if (!isGrid && !pg.imagePrompt.trim()) return this.toast('Write a picture prompt first.', 'warn');
    if (isGrid && !pg.panels.some((x) => x.prompt.trim())) return this.toast('Write at least one panel prompt first.', 'warn');
    this.drawPage(st.id, pg.id);
  }

  /* ---------- reader ---------- */
  setReader(i) { const st = this.cur(); const idx = Math.max(0, Math.min(st ? st.pages.length - 1 : 0, i)); this.setState({ readerIndex: idx }); if (this.state.speaking) this.later(() => this.speakPage(idx), 60); }
  pageText(st, i) {
    const p = st.pages[i];
    if (!p) return '';
    if (p.kind === 'cover') return st.title + '.';
    if (p.kind === 'end') return p.caption + ' The End.';
    let t = p.caption;
    if (p.layout === 'grid') (p.panels || []).forEach((pn) => { if (pn.bubble) { const sp = st.characters.find((c) => c.id === pn.speakerId); t += ' ' + (sp ? sp.name + ' says: ' : '') + pn.bubble; } });
    else if (p.bubble) t = p.bubble + ' ' + t;
    return t;
  }
  speakPage(i) {
    try {
      const synth = window.speechSynthesis; synth.cancel();
      const u = new SpeechSynthesisUtterance(this.pageText(this.cur(), i));
      u.rate = 0.92; u.pitch = 1.05; u.lang = 'en-IN';
      u.onend = () => { if (this.state.readerIndex === i) this.setState({ speaking: false }); };
      synth.speak(u);
    } catch (e) { this.setState({ speaking: false }); this.toast("Read aloud isn't available in this browser.", 'warn'); }
  }
  toggleSpeak() {
    if (this.state.speaking) { try { window.speechSynthesis.cancel(); } catch (e) {} this.setState({ speaking: false }); return; }
    if (!window.speechSynthesis) return this.toast("Read aloud isn't available in this browser.", 'warn');
    this.setState({ speaking: true });
    this.speakPage(this.state.readerIndex);
  }

  /* ---------- share ---------- */
  openShare() {
    const st = this.cur();
    this.setState({ share: { open: true, busy: true, url: '', copied: false, error: false } });
    this.api.shareStory(st.id).then((r) => this.setState({ share: { open: true, busy: false, url: r.shareUrl, copied: false, error: false } }), () => this.setState({ share: { open: true, busy: false, url: '', copied: false, error: true } }));
  }
  copyShare() { const ok = () => this.setState((s) => ({ share: Object.assign({}, s.share, { copied: true }) })); try { navigator.clipboard.writeText(this.state.share.url).then(ok, ok); } catch (e) { ok(); } }
  toggleOffline() {
    const goingOnline = this.state.dev.offline;
    this.setState({ dev: Object.assign({}, this.state.dev, { offline: !goingOnline }) }, () => {
      if (goingOnline) {
        const ids = Array.from(this._unsynced);
        ids.forEach((id) => this.scheduleSync(id));
        this.toast(ids.length ? "You're back online. Syncing your edits." : "You're back online.");
        this.state.stories.filter((x) => x.status === 'illustrating').forEach((x) => this.pump(x.id));
      } else this.toast("You're offline. Edits stay on this device.", 'warn');
    });
  }

  /* =================================================================
     View
     ================================================================= */
  activeVersion(p) { return p.versions.find((v) => v.id === p.activeVersionId) || p.versions[p.versions.length - 1]; }
  panelData(st, p, version) {
    const v = version || this.activeVersion(p);
    let status = 'none';
    if (version) status = 'done';
    else if (p.status === 'drawing') status = 'drawing';
    else if (p.status === 'queued') status = 'queued';
    else if (v) status = 'done';
    else if (p.status === 'failed') status = 'failed';
    const url = v ? v.imageUrl : '';
    const isMock = url.indexOf('mock://') === 0;
    const chars = st.characters;
    const isGrid = p.kind === 'middle' && p.layout === 'grid';
    const panels = isGrid ? (p.panels || []).slice(0, 6).map((pn, k) => {
      const pu = v && v.panelImages ? v.panelImages[k] || '' : '';
      const spk = chars.find((c) => c.id === pn.speakerId);
      const other = chars.find((c) => c.id !== pn.speakerId && c.role === 'nayak') || chars.find((c) => c.id !== pn.speakerId);
      const pair = [spk || other, spk ? other : (chars[1] || null)].filter(Boolean);
      return { imageUrl: pu, art: !pu || pu.indexOf('mock://') === 0 ? this.makeArt(pu || (p.id + k), st, pair) : null, bubble: pn.bubble };
    }) : null;
    return { kind: p.kind, caption: p.caption, layout: p.layout || 'caption', bubble: p.bubble || '', status, imageUrl: url, panels, art: isMock ? this.makeArt(url, st) : null };
  }
  pageLabel(p, i) { return p.kind === 'cover' ? 'Cover' : p.kind === 'end' ? 'Last page' : 'Page ' + (i + 1); }
  starring(st) { const n = this.joinNames(st.characters.filter((c) => c.name).map((c) => c.name)); return n ? 'Starring ' + n : ''; }

  view() {
    const s = this.state, scr = s.screen, st = this.cur();
    const storyScreens = ['desh', 'kaal', 'paatra', 'paristhiti', 'katha', 'writing', 'outline', 'illustrate', 'editor', 'reader'];
    let main = '';
    if (scr === 'landing') main = this.vLanding();
    else if (scr === 'signin') main = this.vSignin();
    else if (scr === 'shared' && st) main = this.vShared(st);
    else if (s.user) {
      let inner = '';
      if (scr === 'library') inner = this.vLibrary();
      else if (st) inner = ({ desh: () => this.vDesh(st), kaal: () => this.vKaal(st), paatra: () => this.vPaatra(st), paristhiti: () => this.vParisthiti(st), katha: () => this.vKatha(st), writing: () => this.vWriting(), outline: () => this.vOutline(st), illustrate: () => this.vIllustrate(st), editor: () => this.vEditor(st), reader: () => this.vReader(st) }[scr] || (() => ''))();
      main = this.vHeader() + when(s.dev.offline, `<div role="status" style="background:#141414;color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-weight:700">${ICON.wifiOff} You're offline. Your edits are kept on this device and will sync when you're back. Drawing is paused.</div>`) + when(st && storyScreens.indexOf(scr) >= 0, () => this.vStepper(st)) + `<main class="wrap">${inner}</main>`;
    } else main = this.vLanding();
    return `<div class="app"><div class="no-print">${main}${this.vDialogs(st)}${this.vToasts()}${when(CONFIG.MOCK, () => this.vDev())}</div>${when(st, () => this.vPrint(st))}</div>`;
  }

  vLanding() {
    const cover = { kind: 'cover', status: 'done', imageUrl: 'mock://page/landing', art: this.makeArt('mock://page/landing', { setup: { tone: 'Adventurous', style: 'Comic' } }, [{ role: 'nayak', form: 'Animal', color: '#C98A4B' }, { role: 'mitra', form: 'Human', gender: 'female', color: '#2E9C5A' }, { role: 'guru', form: 'Human', gender: 'male', color: '#8A4FD1' }]) };
    const step = (n, t, d) => `<li class="panel" style="padding:20px;display:flex;flex-direction:column;gap:8px"><span class="h2" style="font-size:40px;color:#1F4FB8">${n}</span><h3 class="h2">${t}</h3><p style="margin:0">${d}</p></li>`;
    return `<header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:5px solid #141414;background:#FFD93B"><span style="font-family:'Bangers',Impact,sans-serif;font-size:28px;letter-spacing:.04em">Comic Storybook Maker</span><button class="btn btn-sm" data-click="${this.H(() => this.go('signin'))}">Sign in</button></header>
    <main>
      <section style="max-width:1160px;margin:0 auto;padding:48px 20px 40px;display:flex;flex-wrap:wrap;gap:40px;align-items:center">
        <div style="flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px">
          <p class="kicker">Panchatantra · Jataka · Itihasa</p>
          <h1 class="display" style="font-size:clamp(52px,9vw,92px)">Comic books with a lesson at heart</h1>
          <p style="margin:0;font-size:21px;max-width:40ch">Build a katha the way the old storytellers did: choose the desh and kaal, bring in your paatra, set the paristhiti, and turn it into a comic your children can read, print and remember.</p>
          <div class="row" style="gap:14px"><button class="btn btn-primary btn-lg" data-click="${this.H(() => this.go('signin'))}">Start a katha</button><a class="btn btn-quiet" href="#how" data-click="${this.H((e) => { e.preventDefault(); const el = document.getElementById('how'); if (el) el.scrollIntoView({ behavior: 'smooth' }); })}">How it works</a></div>
        </div>
        <div style="flex:1 1 280px;max-width:360px;margin:0 auto;transform:rotate(2deg);box-shadow:8px 8px 0 #141414">${pagePanel(cover, 'Chiku and the River Promise', 'Starring Chiku, Neela & Kurma Dada')}</div>
      </section>
      <section id="how" style="max-width:1160px;margin:0 auto;padding:8px 20px 40px">
        <h2 class="h1" style="margin-bottom:20px">How a katha comes together</h2>
        <ol style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:24px">
          ${step(1, 'Desh &amp; Kaal', 'Where and when: a forest by the Narmada, a kingdom in the Treta Yuga, a village at Diwali.')}
          ${step(2, 'Paatra', 'The characters, human or animal, and what drives each one: dharma, artha, kaam or moksh.')}
          ${step(3, 'Paristhiti &amp; Katha', 'The situation, the plot and the lesson. Review every page before any picture is drawn.')}
          ${step(4, 'Read &amp; print', 'Single scenes for simple tales, six-panel comic pages for richer ones. Read aloud, print, or share.')}
        </ol>
      </section>
      <section style="max-width:1160px;margin:0 auto;padding:0 20px 64px"><div class="panel" style="padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:#E6EEFF">${ICON.shield}<p style="margin:0;flex:1 1 300px">Reference images are optional. They're only used to guide the drawings, never appear in shared links, and you can delete them at any time.</p></div></section>
    </main>`;
  }

  vSignin() {
    const s = this.state, si = s.authMode === 'signin';
    return `<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px">
      <div class="panel" style="width:100%;max-width:440px;padding:28px;display:flex;flex-direction:column;gap:18px">
        <button class="linkbtn" style="align-self:flex-start" data-click="${this.H(() => this.go('landing'))}">Back</button>
        <h1 class="display" style="font-size:48px">${si ? 'Welcome back' : 'Create your account'}</h1>
        <button class="btn btn-blue" ${dis(s.authBusy)} data-click="${this.H(() => this.doSignin('you@gmail.com'))}">${ICON.google} Continue with Google</button>
        <div style="display:flex;align-items:center;gap:12px;font-weight:700" aria-hidden="true"><span style="flex:1;height:3px;background:#141414"></span>or with email<span style="flex:1;height:3px;background:#141414"></span></div>
        <form style="display:flex;flex-direction:column;gap:14px" novalidate data-submit="${this.H(() => this.emailSignin())}">
          <div><label class="label" for="auth-email">Email</label><input class="input" id="auth-email" type="email" autocomplete="email" value="${esc(s.email)}" data-input="${this.H((e) => { this.state.email = e.target.value; if (this.state.authError) this.setState({ authError: '' }); })}"></div>
          <div><label class="label" for="auth-pass">Password</label><input class="input" id="auth-pass" type="password" autocomplete="current-password" value="${esc(s.password)}" data-input="${this.H((e) => { this.state.password = e.target.value; if (this.state.authError) this.setState({ authError: '' }); })}"></div>
          ${when(s.authError, `<p class="err" role="alert" style="margin:0">${esc(s.authError)}</p>`)}
          <button class="btn btn-primary" type="submit" ${dis(s.authBusy)}>${when(s.authBusy, '<span class="spin" aria-hidden="true"></span>')}${s.authBusy ? 'Signing in…' : si ? 'Sign in' : 'Create account'}</button>
        </form>
        <div class="row" style="justify-content:space-between;gap:8px">
          <button class="linkbtn" data-click="${this.H(() => this.setState({ authMode: si ? 'signup' : 'signin', authError: '' }))}">${si ? 'New here? Create an account' : 'Have an account? Sign in'}</button>
          <button class="linkbtn" data-click="${this.H(() => this.toast('In production this opens the Cognito reset-password flow.'))}">Forgot password?</button>
        </div>
        <p class="hint" style="margin:0">Sign-in is handled by Amazon Cognito. In mock mode any email works; type a password of "wrong" to see the error state.</p>
      </div></main>`;
  }

  vHeader() {
    const s = this.state;
    const local = s.dev.offline || s.saveState === 'local';
    return `<header style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;border-bottom:5px solid #141414;background:#FFD93B">
      <button class="tile" style="width:auto;font-family:'Bangers',Impact,sans-serif;font-size:26px;letter-spacing:.04em;min-height:44px" data-click="${this.H(() => this.go('library'))}">Comic Storybook Maker</button>
      <nav aria-label="Main" style="flex:1 1 auto;display:flex;gap:8px"><button class="btn btn-sm ${s.screen === 'library' ? 'btn-primary' : 'btn-quiet'}" data-click="${this.H(() => this.go('library'))}">My storybooks</button></nav>
      <span class="badge" role="status" style="background:${local ? '#FFF4C2' : '#fff'}">${when(s.saveState === 'saving' && !s.dev.offline, '<span class="dot pulse" aria-hidden="true"></span>')}${local ? 'Saved on this device' : s.saveState === 'saving' ? 'Saving…' : 'All changes saved'}</span>
      <div style="position:relative">
        <button class="btn btn-sm icon-btn" style="width:48px;border-radius:999px" aria-label="Account menu" aria-expanded="${s.menuOpen}" data-click="${this.H(() => this.setState({ menuOpen: !s.menuOpen }))}">${esc(s.user.email.charAt(0).toUpperCase())}</button>
        ${when(s.menuOpen, `<div class="panel" style="position:absolute;right:0;top:58px;z-index:30;width:260px;padding:12px;display:flex;flex-direction:column;gap:6px"><p style="margin:0 0 6px;font-weight:700;overflow-wrap:anywhere">${esc(s.user.email)}</p><button class="btn btn-sm" data-click="${this.H(() => this.askDeletePhotos())}">Delete my images</button><button class="btn btn-sm btn-quiet" data-click="${this.H(() => { this.go('landing', { user: null, storyId: null, email: '', password: '' }); this.toast('Signed out.'); })}">Sign out</button></div>`)}
      </div></header>`;
  }

  vStepper(st) {
    const s = this.state, pages = st.pages, anyDone = pages.some((p) => p.versions.length);
    const defs = [['desh', 'Desh', true], ['kaal', 'Kaal', true], ['paatra', 'Paatra', true], ['paristhiti', 'Paristhiti', true], ['katha', 'Katha', true], ['outline', 'Outline', pages.length > 0], ['illustrate', 'Pictures', st.status === 'illustrating' || st.status === 'done' || anyDone], ['reader', 'Read', anyDone]];
    const curKey = s.screen === 'writing' ? 'katha' : s.screen === 'editor' ? 'illustrate' : s.screen;
    return `<div style="border-bottom:4px solid #141414;background:#fff"><div style="max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center">
      <p style="margin:0;font-weight:700;flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(st.title)}</p>
      <nav aria-label="Storybook steps"><ol style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px">${each(defs, (d, i) => `<li><button class="chip chip-sm" ${pressed(d[0] === curKey)} ${d[0] === curKey ? 'aria-current="step"' : ''} ${dis(!d[2])} data-click="${this.H(() => this.go(d[0], { readerIndex: 0 }))}"><span style="font-family:'Bangers',Impact,sans-serif;font-size:16px">${i + 1}</span>${d[1]}</button></li>`)}</ol></nav>
    </div></div>`;
  }

  vLibrary() {
    const s = this.state;
    const list = s.libIds ? s.libIds.map((id) => this.storyById(id)).filter(Boolean) : [];
    let body = '';
    if (s.libStatus === 'loading' || s.libStatus === 'idle') body = `<div role="status" aria-label="Loading your storybooks" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:28px">${each([1, 2, 3, 4], () => '<div class="stack" style="gap:10px"><div class="pulse" style="aspect-ratio:210/297;border:5px solid #141414;background:#E4DDCF;border-radius:4px"></div><div class="pulse" style="height:18px;width:70%;background:#D9D1C1;border-radius:6px"></div></div>')}</div>`;
    else if (s.libStatus === 'error') body = `<div class="panel" role="alert" style="padding:28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:560px"><h2 class="h2">We couldn't load your storybooks</h2><p style="margin:0">Your books are safe. This is usually a connection hiccup.</p><button class="btn btn-primary" data-click="${this.H(() => this.loadLibrary())}">Try again</button></div>`;
    else if (!list.length) body = `<div class="panel" style="padding:40px 28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;background-color:#1F4FB8;color:#fff;background-image:radial-gradient(rgba(20,20,20,.3) 1.2px,transparent 1.8px);background-size:14px 14px"><h2 class="display" style="font-size:52px">Your shelf is empty</h2><p style="margin:0;font-size:19px;max-width:46ch">Every katha starts with a place. Pick a desh, add your paatra, and the rest follows.</p><button class="btn btn-primary btn-lg" data-click="${this.H(() => this.newStory())}">Start your first katha</button></div>`;
    else body = `<ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:32px 28px">
      <li><button class="tile" style="height:100%" aria-label="New katha" data-click="${this.H(() => this.newStory())}"><div class="lift" style="aspect-ratio:210/297;border:5px dashed #141414;border-radius:4px;background:#FFFDF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px"><span style="width:64px;height:64px;border:4px solid #141414;border-radius:50%;background:#FFD93B;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 #141414">${ICON.plus}</span><span class="h2">New katha</span></div></button></li>
      ${each(list, (b) => {
        const drawn = b.pages.filter((p) => p.versions.length).length;
        const label = b.status === 'done' ? 'Ready to read' : b.status === 'illustrating' ? 'Drawing ' + drawn + '/' + b.pages.length : b.status === 'outline' ? 'Outline to review' : 'Draft';
        const cp = b.pages[0];
        const v = cp && cp.versions[cp.versions.length - 1];
        const cover = { kind: 'cover', caption: b.title, status: v ? 'done' : 'none', imageUrl: v ? v.imageUrl : '', art: v ? this.makeArt(v.imageUrl, b) : null };
        return `<li class="stack" style="gap:10px"><button class="tile" aria-label="Open ${esc(b.title)}" data-click="${this.H(() => this.openStory(b))}"><div class="lift" style="box-shadow:6px 6px 0 #141414">${pagePanel(cover, b.title, this.starring(b))}</div></button>
          <div class="stack" style="gap:6px"><p style="margin:0;font-weight:700;line-height:1.25">${esc(b.title)}</p><p class="muted" style="margin:0;font-size:14px">${esc([b.setup.inspiration[0], this.clean(b.setup.desh.main)].filter(Boolean).join(' · '))}</p>
          <div class="row" style="gap:6px"><span class="badge ${b.status === 'done' ? 'b-done' : b.status === 'illustrating' ? 'b-drawing' : 'b-queued'}">${label}</span><span class="muted" style="font-size:14px">${this.ago(b.updatedAt)}</span></div>
          <div class="row" style="gap:4px"><button class="linkbtn" style="font-size:15px" data-click="${this.H(() => this.newStory(b))}">Make a sequel</button><span aria-hidden="true">·</span><button class="linkbtn" style="font-size:15px;color:#B3261E" data-click="${this.H(() => this.askDeleteStory(b))}">Delete</button></div></div></li>`;
      })}</ul>`;
    return `<div class="row" style="align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px"><h1 class="display" style="font-size:clamp(44px,7vw,68px)">My storybooks</h1><button class="btn btn-primary" data-click="${this.H(() => this.newStory())}">New katha</button></div>${body}`;
  }

  vRefs(list, target, fileId) {
    return `<div class="row" style="gap:8px">${each(list, (r) => `<span class="reftile">${r.status === 'uploading' ? '<span class="spin spin-sm" aria-hidden="true"></span>' : ICON.image}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${esc(r.name)}</span><span class="muted" style="font-size:13px">${this.fmtSize(r.size)}</span><button class="btn btn-sm" style="min-height:36px;width:36px;padding:0;box-shadow:none" aria-label="Delete ${esc(r.name)}" data-click="${this.H(() => this.removeRef(target, r))}">${ICON.x}</button></span>`)}</div>
      <div><input class="sr-only file-in" id="${fileId}" type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic" data-change="${this.H((e) => this.onRefFiles(target, e))}"><label class="btn btn-sm" for="${fileId}">Add images</label></div>`;
  }
  stepHead(n, name, title, sub) { return `<div><p class="kicker">Step ${n} · ${name}</p><h1 class="h1">${title}</h1><p class="muted" style="margin:8px 0 0;max-width:62ch">${sub}</p></div>`; }
  navRow(backTo, backLabel, nextTo, nextLabel) {
    return `<div class="row" style="justify-content:${backTo ? 'space-between' : 'flex-end'};gap:12px">${when(backTo, () => `<button class="btn" data-click="${this.H(() => this.go(backTo))}">${backLabel || 'Back'}</button>`)}${when(nextTo, () => `<button class="btn btn-primary btn-lg" data-click="${this.H(() => this.go(nextTo))}">${nextLabel}</button>`)}</div>`;
  }

  vDesh(st) {
    const setup = st.setup, subs = setup.desh.subs || [];
    const setDesh = (patch) => this.updateSetup((x) => Object.assign({}, x, { desh: Object.assign({}, x.desh, typeof patch === 'function' ? patch(x.desh) : patch) }));
    const addSub = (v) => setDesh((d) => ({ subs: d.subs.length >= 6 ? d.subs : d.subs.concat([v]) }));
    const ideas = ['A forest on the banks of the Narmada', 'The kingdom of Kashi', 'A village by the Ganga', 'An ashram in the Himalayas', 'The Dandaka forest'];
    const subIdeas = ['Banyan tree', 'River ghat', 'Palace courtyard', 'Gurukul', 'Village well', 'Mango grove'].filter((t) => subs.indexOf(t) < 0);
    const full = subs.length >= 6;
    return `<div style="max-width:860px;display:flex;flex-direction:column;gap:26px">
      ${this.stepHead(1, 'Desh', 'Where does the story happen?', 'Name the main place, then the smaller spots where scenes unfold. Each page of the comic is set in one of these.')}
      <div><label class="label" for="desh-main">Main place (desh)</label><input class="input" id="desh-main" value="${esc(setup.desh.main)}" placeholder="e.g. A forest on the banks of the Narmada" data-input="${this.H((e) => setDesh({ main: e.target.value }))}">
        <div class="row" style="gap:8px;margin-top:10px"><span class="hint" style="margin:0">Ideas:</span>${each(ideas, (t) => `<button class="chip chip-sm chip-light" data-click="${this.H(() => setDesh({ main: t }))}">${esc(t)}</button>`)}</div></div>
      <div class="panel" style="padding:18px;display:flex;flex-direction:column;gap:14px">
        <h2 class="h2">Sublocations</h2><p class="muted" style="margin:0">The banyan tree, the river ghat, the palace courtyard… Up to 6.</p>
        <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">${each(subs, (v, i) => `<li style="display:flex;gap:10px;align-items:center"><span aria-hidden="true" style="flex:0 0 auto;width:36px;height:36px;border:3px solid #141414;border-radius:50%;background:#FFD93B;display:flex;align-items:center;justify-content:center;font-family:'Bangers',Impact,sans-serif;font-size:18px">${i + 1}</span><label class="sr-only" for="sub-${i}">Sublocation ${i + 1}</label><input class="input" id="sub-${i}" value="${esc(v)}" data-input="${this.H((e) => { const val = e.target.value; setDesh((d) => { const ss = d.subs.slice(); ss[i] = val; return { subs: ss }; }); })}"><button class="btn btn-sm icon-btn" style="flex:0 0 auto" aria-label="Remove sublocation ${i + 1}" data-click="${this.H(() => setDesh((d) => ({ subs: d.subs.filter((y, k) => k !== i) })))}">${ICON.x}</button></li>`)}</ol>
        ${when(!subs.length, '<p class="hint" style="margin:0">No sublocations yet. One is enough for a short tale.</p>')}
        <div class="row" style="gap:8px"><button class="btn btn-sm btn-primary" ${dis(full)} data-click="${this.H(() => { addSub(''); this.later(() => { const el = document.getElementById('sub-' + subs.length); if (el) el.focus(); }, 30); })}">+ Add a sublocation</button>${each(subIdeas, (t) => `<button class="chip chip-sm chip-light" ${dis(full)} data-click="${this.H(() => addSub(t))}">${esc(t)}</button>`)}</div>
      </div>
      <div class="panel" style="padding:18px;display:flex;flex-direction:column;gap:12px;background:#FFFDF8">
        <h2 class="h2">Reference images for places <span class="muted" style="font-family:'Comic Neue',sans-serif;font-size:15px;letter-spacing:0">(optional)</span></h2>
        <p class="muted" style="margin:0">A temple you visited, a painting style you like, a photo of your village. Add several if you like.</p>
        ${this.vRefs(setup.refs, { type: 'place' }, 'place-refs')}
      </div>
      ${this.navRow(null, null, 'kaal', 'Next: Kaal')}
    </div>`;
  }

  vKaal(st) {
    const setup = st.setup, k = setup.kaal;
    const setK = (patch) => this.updateSetup((x) => Object.assign({}, x, { kaal: Object.assign({}, x.kaal, typeof patch === 'function' ? patch(x.kaal) : patch) }));
    const subs = (setup.desh.subs || []).filter(Boolean);
    const line = (this.clean(setup.desh.main) || '[no place yet]') + (subs.length ? ' (' + subs.join(', ') + ')' : '') + ', ' + this.kaalPhrase(k) + '.';
    return `<div style="max-width:860px;display:flex;flex-direction:column;gap:26px">
      ${this.stepHead(2, 'Kaal', 'When does it happen?', 'The time period shapes clothes, buildings and how people speak. "Long, long ago" works perfectly for fables.')}
      <fieldset><legend class="label">Time period</legend><div class="row">${each(ERAS, (v) => `<button class="chip" ${pressed(k.era === v)} data-click="${this.H(() => setK({ era: v }))}">${esc(v)}</button>`)}</div></fieldset>
      <div><label class="label" for="kaal-custom">Or describe it in your words <span class="muted" style="font-weight:400">(optional)</span></label><input class="input" id="kaal-custom" value="${esc(k.custom)}" placeholder="e.g. The year the great banyan was planted, when kings still travelled by elephant" data-input="${this.H((e) => setK({ custom: e.target.value }))}"></div>
      <fieldset><legend class="label">Season (ritu) <span class="muted" style="font-weight:400">(optional)</span></legend><div class="row">${each(RITUS, (v) => `<button class="chip" ${pressed(k.ritu === v)} data-click="${this.H(() => setK((kk) => ({ ritu: kk.ritu === v ? '' : v })))}">${esc(v)}</button>`)}</div></fieldset>
      <div class="note"><span><strong>So far:</strong> ${esc(line)}</span></div>
      ${this.navRow('desh', 'Back', 'paatra', 'Next: Paatra')}
    </div>`;
  }

  vPaatra(st) {
    const chars = st.characters;
    const nayaks = chars.filter((x) => x.role === 'nayak').length;
    const heroMissing = !chars.some((c) => c.role === 'nayak' && c.name.trim());
    const pending = chars.filter((c) => c.sheet.status !== 'approved');
